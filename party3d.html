<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ห้องรวม 3D · HR Arcade</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧊</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}</script>
<style>
:root{--bg:#fff4e6;--ink:#2b2140;--line:#2b2140;--pri:#ff5c8a;--yel:#ffd23f;--ok:#21c07a;--muted:#7a6f8c}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Kanit,"Leelawadee UI",Tahoma,sans-serif;-webkit-tap-highlight-color:transparent}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:3px solid var(--line);background:#fff}
.top h1{font-size:18px;margin:0;flex:1}
.btn{font:inherit;font-weight:600;border:3px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;box-shadow:0 4px 0 var(--line);cursor:pointer;color:var(--ink);text-decoration:none;user-select:none;touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.primary{background:var(--pri);color:#fff}.btn.sm{padding:3px 10px;font-size:14px;box-shadow:0 3px 0 var(--line);border-width:2px}
.btn.on{background:var(--yel)}
main{max-width:1200px;margin:0 auto;padding:12px 16px 40px}
.wrap{display:grid;grid-template-columns:1fr 240px;gap:12px}
@media (max-width:900px){.wrap{grid-template-columns:1fr}}
.stage{position:relative;border:3px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 6px 0 var(--line);background:#cfe9ff;aspect-ratio:16/10}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;transform:translate(-50%,-100%);text-align:center;white-space:nowrap}
.tag .nm{font-weight:600;font-size:13px;color:var(--ink);text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}
.tag .nm.me{color:#d6336c}
.tag .bub[hidden]{display:none}
.tag .bub{display:inline-block;background:#fff;border:2px solid var(--line);border-radius:10px;padding:1px 10px;font-weight:600;margin-bottom:2px;animation:pop .2s}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.hud{position:absolute;left:10px;top:8px;font-size:12px;background:rgba(255,255,255,.75);border-radius:8px;padding:2px 8px;pointer-events:none}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,244,230,.9);font-weight:600}
.side{background:#fff;border:3px solid var(--line);border-radius:14px;padding:10px 12px;align-self:start}
.side h3{margin:0 0 6px}.side ul{list-style:none;margin:0;padding:0}
.side li{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px dashed #e2d8c8}
.side li img{width:26px;height:26px;object-fit:contain}
.side p{font-size:13px;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center}
.touch{display:none;justify-content:space-between;align-items:center;margin-top:10px}
@media (pointer:coarse){.touch{display:flex}}
.joy{width:120px;height:120px;border-radius:50%;background:#fff;border:3px solid var(--line);position:relative;touch-action:none}
.joy i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:var(--yel);border:3px solid var(--line)}
.overlay{position:fixed;inset:0;background:rgba(43,33,64,.55);display:grid;place-items:center;z-index:50;padding:16px}
.panel{background:#fff;border:3px solid var(--line);border-radius:20px;box-shadow:0 8px 0 var(--line);padding:20px;max-width:520px;width:100%;text-align:center}
.panel h2{margin:4px 0 6px}
.field{display:flex;align-items:center;gap:8px;margin:10px 0;font-weight:600}
.field input{flex:1;font:inherit;border:3px solid var(--line);border-radius:10px;padding:6px 10px}
.avas{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.avas button{padding:4px;border:3px solid transparent;border-radius:12px;background:#f6efe4;cursor:pointer}
.avas button.on{border-color:var(--line);background:var(--yel)}
.avas img{width:100%;aspect-ratio:1;object-fit:contain;display:block}
.muted{color:var(--muted)}
</style>
</head>
<body>
<header class="top"><a class="btn sm" href="./">🏠 หน้าหลัก</a><h1>🧊 ห้องรวม 3D <span class="muted" style="font-size:14px">(ทดลอง)</span></h1><button class="btn sm" id="gfx">✨ กราฟิกสูง</button></header>
<main>
  <div class="wrap">
    <div>
      <div class="stage" id="stage"><div class="labels" id="labels"></div><div class="hud" id="hud"></div><div class="loading" id="loading">⏳ กำลังโหลดโมเดล 3D…</div></div>
      <div class="touch"><div class="joy" id="joy"><i></i></div><div class="bar"><button class="btn primary" id="tJump">⤒ กระโดด</button></div></div>
      <div class="bar" id="emotes"></div>
    </div>
    <aside class="side"><h3>👥 ในห้องตอนนี้</h3><ul id="plist"></ul>
      <p>⬅️⬆️⬇️➡️ / WASD เดิน · Space กระโดด · 1-8 อีโมจิ<br>กล้องล็อกมุมเดียวกันทุกคน — ทุกคนเห็นห้องเหมือนกัน</p>
      <p>🎨 โมเดล 3D: <a href="https://kenney.nl/assets/mini-characters" target="_blank" rel="noopener">Kenney Mini Characters</a> + <a href="https://kenney.nl/assets/furniture-kit" target="_blank" rel="noopener">Furniture Kit</a> (CC0)</p></aside>
  </div>
</main>
<script type="module" src="party3d.js?v=3"></script>
</body>
</html>
