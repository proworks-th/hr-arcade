<style>
:root{--ink:#3b2316;--pink:#ff6fa8;--card:#fff8ec;--muted:#7a5c48}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1b1422;font-family:Kanit,"Leelawadee UI",Tahoma,sans-serif;color:var(--ink)}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
.chip{position:absolute;background:var(--card);border:3px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink);padding:5px 12px;font-weight:600;font-size:14px;z-index:3}

.tag.me{background:#ffe066}.tag.npc{background:#e3f1ff}.tag.lot{background:#efe4d0;font-weight:500;font-size:11px;color:var(--muted)}
.tag.place{background:#fff;font-size:13px;font-weight:700;border-width:3px;border-radius:11px}
.bub{position:absolute;transform:translate(-50%,-100%);background:#fff;border:2px solid var(--ink);border-radius:12px;padding:3px 9px;font-size:13px;max-width:230px;pointer-events:none;text-align:center}
.pop{position:absolute;transform:translate(-50%,-100%);font-weight:800;font-size:16px;color:#e8467c;text-shadow:0 2px 0 #fff,0 -1px 0 #fff;pointer-events:none;transition:transform 1.2s ease-out,opacity 1.2s}

.hearts{font-size:17px;letter-spacing:1px;margin-top:2px}
.lvl{font-size:12px;color:var(--muted)}

<script>
'use strict';
(async () => {
/* ============ assets ============ */
const img = src => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error('missing ' + src)); i.src = src; });
const S = Object.fromEntries(await Promise.all(['grass', 'house', 'maple', 'fences'].map(async n => [n, await img('farmrpg/' + n + '.png')])));
const K = Object.fromEntries(await Promise.all(['farm', 'city', 'battle', 'dungeon', 'cursor'].map(async n => [n, await img('kenney/' + (n === 'cursor' ? 'cursor-pixel-pack' : 'tiny-' + n) + '/tilemap_packed.png')])));
const WHO = ['adam', 'alex', 'amelia', 'bob'], CH = {};
await Promise.all(WHO.flatMap(w => ['run', 'idle_anim'].map(async a => { CH[w + a] = await img('../assets/mi/chars/' + w + '_' + a + '.png'); })));
const [farmSrc, soloSrc] = await Promise.all(['../farm.js', '../solo-games.js'].map(u => fetch(u).then(r => r.text())));
const CROPS = new Function('return {' + farmSrc.split('const CROPS = {')[1].split('\n};')[0] + '}')();
const PAL = new Function('return {' + soloSrc.split('const PXA_PAL = {')[1].split('};')[0] + '}')();
const STAGE_ART = { seed: ['..........', '...c..c...', '..cCccCc..', '.cCCCCCCc.'], sprout: ['.gg...gg.', 'gggg.gggg', '.gGGgGGg.', '...GgG...', '....G....', '....G....'],
  grow: ['..g..g..g..', '.ggg.g.ggg.', 'ggGggGggGgg', '.gGgGgGgGg.', '..gGGGGGg..', '...gGGGg...', '....GGG....', '....G.G....'] };
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const pxCache = {};
function pxa(rows) { const key = rows.join('|'); if (pxCache[key]) return pxCache[key];
  const c = mk(Math.max(...rows.map(r => r.length)), rows.length), g = c.getContext('2d');
  rows.forEach((r, y) => [...r].forEach((ch, x) => { if (ch !== '.') { g.fillStyle = PAL[ch]; g.fillRect(x, y, 1, 1); } })); return (pxCache[key] = c); }
const cropArt = id => pxa(CROPS[id][5]), cropName = id => CROPS[id][0];
const cropURL = {}; const cropImg = id => cropURL[id] ??= (() => { const s = cropArt(id), c = mk(s.width * 3, s.height * 3);
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false; g.drawImage(s, 0, 0, c.width, c.height); return c.toDataURL(); })();
const ktc = {};
const kt = (sh, id) => ktc[sh + id] ??= (() => { const s = K[sh], cols = s.width / 16, c = mk(16, 16); c.getContext('2d').drawImage(s, (id % cols) * 16, (id / cols | 0) * 16, 16, 16, 0, 0, 16, 16); return c; })();
function tiles(sh, rows) { const c = mk(Math.max(...rows.map(r => r.length)) * 16, rows.length * 16), g = c.getContext('2d');
  rows.forEach((r, y) => r.forEach((id, x) => { if (id != null) g.drawImage(kt(sh, id), x * 16, y * 16); })); return c; }

/* ============ world grid: the live 48×34 village, grown to 72×48, plus a strip of rooms off to the right ============ */
const T = 16, VC = 72, VR = 48, RX0 = 76, C = RX0 + 8 * 16, R = VR, O = '#3b2316';
const rnd = (s => () => (s = s * 16807 % 2147483647) / 2147483647)(7);
const ri = n => Math.floor(rnd() * n);
const grid = v => Array.from({ length: R }, (_, y) => Array.from({ length: C }, (_, x) => x >= VC ? (v === 1 ? 10 : 1) : v));
const G = grid(1), block = grid(0), res = grid(0).map(r => r.map(() => 0));
const setG = (x, y, v) => { if (G[y] && G[y][x] !== undefined) G[y][x] = v; };
const rect = (x0, y0, x1, y1, f) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) f(x, y); };
// live roads
for (let x = 0; x <= 48; x++) { setG(x, 9, 0); setG(x, 10, 0); }
for (let y = 7; y <= 35; y++) { setG(22, y, 0); setG(34, y, 0); }
for (const y of [16, 23, 30]) for (let x = 1; x <= 48; x++) setG(x, y, 0);
rect(1, 11, 9, 17, (x, y) => setG(x, y, 3)); setG(5, 7, 3); setG(5, 8, 3);
// new: east lane, farm road, town street (asphalt + sidewalks)
for (let y = 11; y <= 35; y++) setG(48, y, 0);
rect(1, 34, 70, 35, (x, y) => setG(x, y, 0));
rect(49, 9, 71, 10, (x, y) => setG(x, y, 4));
rect(49, 7, 71, 8, (x, y) => setG(x, y, 5)); rect(49, 11, 71, 11, (x, y) => setG(x, y, 5));
rect(49, 18, 53, 18, (x, y) => setG(x, y, 5)); rect(59, 12, 59, 25, (x, y) => setG(x, y, 5)); rect(59, 25, 70, 25, (x, y) => setG(x, y, 5));
const TOWER = { x: 1, y: 1, w: 8 }, BOARD = [8, 12], WELL = [5, 13];
rect(1, 1, 8, 6, (x, y) => block[y][x] = 1);
for (const r of [[49, 0, 70, 8], [49, 12, 58, 19], [59, 12, 70, 33], [1, 33, 70, 45]]) rect(...r, (x, y) => res[y][x] = 1);

const STAGE_TH = ['ว่าง', 'จองที่ดินแล้ว', 'บ้านหลังแรก', 'บ้านหลังใหญ่', 'สวน 14 แปลง', 'ขึ้นบ้านใหม่'];
const ROOFS = { blue: '#8796ad', red: null, green: '#5f9e4f', purple: '#8b6bbf', brown: '#8a5a3c', pink: '#e98bab', teal: '#3f9e9b', navy: '#3d4f8a' };
const ROOF_IN = { blue: '#8796ad', red: '#d9534f', green: '#5f9e4f', purple: '#8b6bbf', brown: '#8a5a3c', pink: '#e98bab', teal: '#3f9e9b', navy: '#3d4f8a' };
const WALLS = { wood: null, stone: '#aab3c0', white: '#efe7da', yellow: '#f2cf63', mint: '#a9dcc4', peach: '#f4b38c' };
const WALL_IN = { wood: '#e8c79c', stone: '#c9d0da', white: '#f3ece0', yellow: '#f7dd85', mint: '#bfe6d3', peach: '#f8c7a6' };
const LOTS = [];
[4, 12, 19, 26].forEach(y => [11, 23, 35].forEach(x => LOTS.push({ id: LOTS.length + 1, x, y, stage: 0 })));
const SHOW = [[5, 'แพร', 'blue', 'wood', 'tmo', 'tom'], [3, 'เอก', 'red', 'wood', '', 'car', 1], [0], [2, 'ฝน', 'green', 'white', 'o', 'let'],
  [5, 'พล', 'pink', 'peach', 'fmpo', 'chi'], [1, 'จอย', '', '', '', 'bok'], [4, 'ต้น', 'navy', 'stone', 'p', 'cor', 1], [2, 'เบียร์', 'red', 'wood', '', 'bok', 1],
  [0], [5, 'มิ้นท์', 'teal', 'mint', 'to', 'wat'], [2, 'ปุ๊ก', 'purple', 'yellow', 'm', 'pum'], [0]];
LOTS.forEach((L, i) => { const [stage, owner, rc, wc, xs, crop, b] = SHOW[i]; Object.assign(L, { stage, owner, rc: rc || 'red', wc: wc || 'wood', xs: xs || '', crop: crop || 'bok', building: !!b, pct: .35 + i * .04 }); });
const MY = LOTS[4];
for (const L of LOTS) setG(L.x + 2, L.y + 3, 3);

/* ============ rooms: each enterable building gets a room in the strip; the door mat takes you back out ============ */
const ROOMS = [], ROOM = {};
function makeRoom(o) { const i = ROOMS.length, x0 = RX0 + 2 + (i % 8) * 16, y0 = 1 + (i >> 3) * 12, r = { ...o, x0, y0 };
  r.door = [x0 + (o.w >> 1), y0 + o.h]; r.entry = [r.door[0], r.door[1] - 1];
  rect(x0, y0, x0 + o.w - 1, y0 + o.h - 1, (x, y) => { const wall = y < y0 + 2; G[y][x] = wall ? 9 : 8; block[y][x] = wall ? 1 : 0; });
  G[r.door[1]][r.door[0]] = 11; block[r.door[1]][r.door[0]] = 0;
  ROOMS.push(r); if (o.key) ROOM[o.key] = r; return r; }
const sceneOf = c => ROOMS.find(r => c[0] >= r.x0 && c[0] < r.x0 + r.w && c[1] >= r.y0 && c[1] <= r.y0 + r.h) || null;

/* ============ grass autotile from the Maeve sheet ============ */
const ga = (() => { const c = mk(S.grass.width, S.grass.height), g = c.getContext('2d'); g.drawImage(S.grass, 0, 0); return g.getImageData(0, 0, c.width, c.height); })();
const alphaAt = (x, y) => ga.data[(y * ga.width + x) * 4 + 3] > 0 ? 1 : 0;
function qStats(tx, ty, q) { const fx = q & 1, fy = q >> 1, px = (u, v) => alphaAt(tx * 16 + (fx ? 15 - u : u), ty * 16 + (fy ? 15 - v : v));
  let eH = 0, eV = 0, co = 0, core = 0;
  for (let i = 3; i < 8; i++) for (let j = 0; j < 2; j++) { eH += 1 - px(i, j); eV += 1 - px(j, i); }
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) co += 1 - px(i, j);
  for (let i = 3; i < 8; i++) for (let j = 3; j < 8; j++) core += 1 - px(i, j);
  return [eH / 10, eV / 10, co / 4, core / 25]; }
const WANT = { full: [0, 0, 0, 0], outer: [1, 1, 1, 0], h: [1, 0, .6, 0], v: [0, 1, .6, 0], inner: [0, 0, 1, 0] }, QPICK = {};
for (const [k, w] of Object.entries(WANT)) for (let q = 0; q < 4; q++) { let best = 1e9, at = null;
  for (let ty = 0; ty < 4; ty++) for (let tx = 0; tx < 12; tx++) { const s = qStats(tx, ty, q), d = s.reduce((a, v, i) => a + (v - w[i]) ** 2 * (i === 3 ? 4 : 1), 0); if (d < best) { best = d; at = [tx, ty]; } }
  QPICK[k + q] = at; }
const grassAt = (x, y) => x < 0 || y < 0 || x >= VC || y >= VR ? true : G[y][x] === 1 || G[y][x] === 6;

/* ============ Maeve houses, repainted per lot ============ */
const hexRGB = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function paint(src, roof, wall) {
  const c = mk(src.width, src.height), g = c.getContext('2d'); g.drawImage(src, 0, 0);
  if (!roof && !wall) return c;
  const d = g.getImageData(0, 0, c.width, c.height), p = d.data, eave = c.height - 37, R0 = roof && hexRGB(roof), W0 = wall && hexRGB(wall);
  for (let i = 0; i < p.length; i += 4) { if (!p[i + 3]) continue; const r = p[i], gg = p[i + 1], b = p[i + 2], y = (i / 4 / c.width) | 0, l = (r + gg + b) / 3;
    if (R0 && y < eave && r > gg * 1.5 && r > b * 1.8 && r > 60) { const f = Math.min(1.45, l / 92); p[i] = R0[0] * f; p[i + 1] = R0[1] * f; p[i + 2] = R0[2] * f; }
    else if (W0 && r > 190 && gg > 150 && b > 120 && r - b < 90) { const f = l / 196; p[i] = Math.min(255, W0[0] * f); p[i + 1] = Math.min(255, W0[1] * f); p[i + 2] = Math.min(255, W0[2] * f); } }
  g.putImageData(d, 0, 0); return c; }
const cottageRaw = (() => { const c = mk(72, 95); c.getContext('2d').drawImage(S.house, 148, 3, 72, 95, 0, 0, 72, 95); return c; })();
const bigRaw = (() => { const c = mk(72, 95), g = c.getContext('2d');
  g.drawImage(S.house, 90, 64, 13, 30, 46, 0, 13, 30); g.drawImage(S.house, 4, 3, 72, 86, 0, 9, 72, 86);
  g.drawImage(S.house, 112, 3, 32, 23, 20, 72, 32, 23); g.drawImage(S.house, 81, 8, 14, 13, 4, 65, 14, 13); g.drawImage(S.house, 81, 8, 14, 13, 54, 65, 14, 13); return c; })();
const houseCache = {};
const isBig = L => L.stage >= 3 && !(L.stage === 3 && L.building);
const hasHouse = L => L.stage >= 2 && !(L.stage === 2 && L.building);
const houseFor = L => { const big = isBig(L), k = (big ? 'b' : 'c') + L.rc + L.wc; return houseCache[k] ??= paint(big ? bigRaw : cottageRaw, ROOFS[L.rc], WALLS[L.wc]); };

/* ============ hand-drawn bits (dark outline, warm wood) ============ */
function sprite(w, h, fn) { const c = mk(w, h), g = c.getContext('2d'); fn(g, (x, y, ww, hh, col) => { g.fillStyle = col; g.fillRect(x, y, ww, hh); }); return c; }
const SIGN = sprite(14, 16, (g, r) => { r(6, 6, 2, 10, O); r(0, 0, 14, 9, O); r(1, 1, 12, 7, '#c98b54'); r(1, 1, 12, 2, '#e0a76c'); r(3, 4, 8, 1, '#7a4a2c'); });
const STAKE = sprite(4, 9, (g, r) => { r(1, 0, 2, 9, O); r(1, 0, 1, 8, '#c98b54'); r(0, 0, 4, 2, '#e05a5a'); });
const JAR = sprite(10, 12, (g, r) => { r(1, 2, 8, 10, O); r(2, 3, 6, 8, '#a8613a'); r(3, 0, 4, 3, O); r(3, 4, 2, 4, '#c98b54'); });
const LANTERN = sprite(8, 22, (g, r) => { r(3, 6, 2, 16, O); r(0, 0, 8, 8, O); r(1, 1, 6, 6, '#ffd36b'); r(2, 2, 2, 2, '#fff4c2'); r(1, 20, 6, 2, O); });
const BOARD_S = sprite(28, 26, (g, r) => { r(3, 10, 3, 16, O); r(22, 10, 3, 16, O); r(0, 0, 28, 17, O); r(1, 1, 26, 15, '#9c5b34'); r(1, 1, 26, 3, '#b97a45');
  r(4, 5, 7, 8, '#fff4e0'); r(13, 4, 6, 7, '#ffe3f0'); r(20, 6, 5, 7, '#e3f1ff'); r(6, 7, 3, 1, '#7a5c48'); r(14, 6, 4, 1, '#7a5c48'); });
const WELL_S = sprite(26, 30, (g, r) => { r(1, 0, 24, 6, O); r(2, 1, 22, 4, '#c4553c'); r(3, 6, 2, 12, O); r(21, 6, 2, 12, O);
  r(0, 16, 26, 14, O); r(1, 17, 24, 12, '#aab3c0'); for (let i = 0; i < 4; i++) r(1 + i * 6 + (i % 2) * 2, 20 + (i % 2) * 4, 1, 4, '#7d8796'); r(3, 17, 20, 3, '#3f86c4'); });
const LAMP = sprite(8, 30, (g, r) => { r(3, 8, 2, 22, O); r(1, 28, 6, 2, O); r(0, 0, 8, 9, O); r(1, 1, 6, 7, '#ffe9a8'); });
const SCAFF = sprite(80, 70, (g, r) => { for (const x of [2, 74]) r(x, 0, 4, 70, O), r(x + 1, 0, 2, 70, '#c98b54'); for (const y of [18, 44]) r(0, y, 80, 4, O), r(0, y + 1, 80, 2, '#d9a066'); });
const FOUND = sprite(64, 30, (g, r) => { r(0, 6, 64, 24, O); r(1, 7, 62, 22, '#b07a4a'); for (let i = 0; i < 6; i++) r(3 + i * 10, 9, 8, 18, '#c98b54'), r(3 + i * 10, 9, 8, 2, '#e0a76c'); r(0, 0, 4, 30, O); r(60, 0, 4, 30, O); });

const DIR = { right: 0, up: 1, left: 2, down: 3 };
const people = [];
function person(name, cls, who, x, y) { const P = { name, cls, who, px: x * T + 8, py: y * T + 12, path: [], dir: 'down', moving: false, t: Math.random() * 5, speed: 46 };
  P.el = document.createElement('div'); P.el.className = 'tag ' + cls; P.el.textContent = name; document.body.append(P.el); people.push(P); return P; }
const cellOf = P => [Math.floor(P.px / T), Math.floor(P.py / T)];
const walkable = (x, y) => x >= 0 && y >= 0 && x < C && y < R && !block[y][x];
function bfs(from, to) { const k = (x, y) => y * C + x, prev = new Map([[k(...from), -1]]), q = [from];
  while (q.length) { const [x, y] = q.shift(); if (x === to[0] && y === to[1]) break;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const nx = x + dx, ny = y + dy; if (walkable(nx, ny) && !prev.has(k(nx, ny))) { prev.set(k(nx, ny), k(x, y)); q.push([nx, ny]); } } }
  if (!prev.has(k(...to))) return null; const out = []; for (let c = k(...to); c !== k(...from) && c >= 0; c = prev.get(c)) out.unshift([c % C, Math.floor(c / C)]); return out; }
function near(tx, ty) { for (let r = 0; r < 7; r++) for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) if (Math.max(Math.abs(dx), Math.abs(dy)) === r && walkable(tx + dx, ty + dy)) return [tx + dx, ty + dy]; return null; }
const go = (P, t) => { const c = near(...t), p = c && bfs(cellOf(P), c); if (p) P.path = p; return !!p; };
const place = (P, c) => { P.px = c[0] * T + 8; P.py = c[1] * T + 12; P.path = []; };
// walk somewhere, going through doors when the target is inside (or outside) a building
function travel(P, cell, after) { P.after = null;
  let from = sceneOf(cellOf(P)); const to = sceneOf(cell);
  if (from && from !== to) { place(P, from.out); from = null; }
  if (to && from !== to) { P.after = () => { place(P, to.entry); go(P, cell); if (after) P.after = after; }; if (!go(P, to.out)) { const f = P.after; P.after = null; f(); } return; }
  go(P, cell); P.after = after || null; }
function drawPerson(g, P) { const sh = CH[P.who + (P.moving ? 'run' : 'idle_anim')], f = Math.floor(P.t * (P.moving ? 10 : 6)) % 6;
  g.drawImage(sh, (DIR[P.dir] * 6 + f) * 16, 0, 16, 32, Math.round(P.px - 8), Math.round(P.py - 29), 16, 32); }

const cam = { x: me.px, y: me.py }, bubbles = [], held = new Set();

  for (const P of people) { P.t += dt; P.moving = !!P.path.length;
    if (P.path.length) { const [nx, ny] = P.path[0], tx = nx * T + 8, ty = ny * T + 12, dx = tx - P.px, dy = ty - P.py, d = Math.hypot(dx, dy), st = P.speed * dt;
      P.dir = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'left' : 'right') : (dy < 0 ? 'up' : 'down');

  if (ms && !me.path.length) { const c = cellOf(me); if (c[0] === ms.door[0] && c[1] === ms.door[1]) { place(me, ms.out); me.dir = 'down'; } }
  const now_s = sceneOf(cellOf(me)); if (now_s !== scene) enterScene(now_s);

    if (d < 1) { if (Math.random() < dt * .5) { a.tx = (9 + rnd() * 9) * T; a.ty = (38.2 + rnd() * 5) * T; } } else { a.x += dx / d * a.sp * dt; a.y += dy / d * a.sp * dt; if (Math.abs(dx) > .5) a.f = dx < 0 ? -1 : 1; } a.mv = d >= 1; }
  for (const c of CARS) { c.x += c.d * c.v * dt; if (c.x > 72 * T) c.x = 47 * T; if (c.x < 47 * T) c.x = 72 * T; }

  const sr = sceneRect(scene), fit = (c, len, a, b) => len <= b ? Math.round(a - (b - len) / 2) : Math.round(Math.max(a, Math.min(a + len - b, c - b / 2)));

  const inView = y => y > oy - 40 && y < oy + cv.height + 140;
  const list = objs.filter(o => o.y >= 1e6 || inView(o.y)).map(o => ({ y: o.y, o })).concat(people.map(P => ({ y: P.py, P })), ANIM.map(a => ({ y: a.y + 14, a })), CARS.map(c => ({ y: c.y, c }))).sort((a, b) => a.y - b.y);
  for (const it of list) {
    if (it.o) { if (it.o.shadow) shadow(g, ...it.o.shadow); it.o.draw(g, gameT); }
    else if (it.P) { shadow(g, it.P.px, it.P.py + 2, 6); drawPerson(g, it.P); }
    else if (it.a) { const a = it.a, b = a.mv ? Math.abs(Math.sin(a.t * 10)) * 1.5 : 0; shadow(g, a.x + 8, a.y + 15, 6); g.save(); g.translate(Math.round(a.x + 8), Math.round(a.y - b)); g.scale(a.f, 1); g.drawImage(kt('farm', a.id), -8, 0); g.restore(); }
    else { const c = it.c; g.save(); g.translate(Math.round(c.x), Math.round(c.y - 32)); if (c.d < 0) { g.scale(-1, 1); g.translate(-32, 0); } g.drawImage(c.spr, 0, 0); g.restore(); } }
  for (const L of LOTS) if (L.bar) { const x = (L.x + 2) * T - 12, y = (L.y + 3) * T + 6; g.fillStyle = O; g.fillRect(x, y, 40, 5); g.fillStyle = '#fff4e0'; g.fillRect(x + 1, y + 1, 38, 3); g.fillStyle = '#5fbf5a'; g.fillRect(x + 1, y + 1, 38 * L.pct, 3); }
  g.restore();
  const tn = tint(hour, !!scene);
  if (tn) { g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'multiply'; g.globalAlpha = tn[1]; g.fillStyle = tn[0]; g.fillRect(0, 0, cv.width, cv.height);
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.translate(-ox, -oy);

/* ============ cards ============ */

const face = (who, k = 3) => { const c = mk(16 * k, 32 * k), g = c.getContext('2d'); g.imageSmoothingEnabled = false; g.drawImage(CH[who + 'idle_anim'], 18 * 16, 0, 16, 32, 0, 0, 16 * k, 32 * k); return c; };
const heartRow = N => { const h = hearts(N); return '❤️'.repeat(h) + '🤍'.repeat(10 - h); };

function pick(wx, wy) {

})().catch(e => { document.body.insertAdjacentHTML('beforeend', `<pre style="position:absolute;top:120px;left:12px;background:#fff;padding:8px;white-space:pre-wrap;z-index:9">${e && e.stack || e}</pre>`); console.error(e); });
