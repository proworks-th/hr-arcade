<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<!-- ?test=1 swaps Firebase for in-memory mocks (verify/); does nothing for normal visits -->
<script src="verify/testmode.js?v=2"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ห้องพักสมอง · HR Arcade</title>
<link rel="icon" id="favicon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕹️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff4e6;--ink:#2b2140;--card:#fff;--line:#2b2140;--pri:#ff5c8a;--yel:#ffd23f;--ok:#21c07a;--bad:#ff4d4d;--blue:#3a86ff;--muted:#7a6f8c;
  --emoji:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg) radial-gradient(#ffe0c2 1.2px,transparent 1.2px) 0 0/18px 18px;color:var(--ink);
  font-family:Kanit,"Leelawadee UI",Tahoma,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
kbd{font-family:inherit;font-size:.75em;border:2px solid currentColor;border-radius:6px;padding:0 5px;opacity:.8}
.muted{color:var(--muted)}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:3px solid var(--line);background:#fff;position:sticky;top:0;z-index:20}
.top h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{font-weight:600;border:3px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;box-shadow:0 4px 0 var(--line);cursor:pointer;user-select:none;touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.primary{background:var(--pri);color:#fff}.btn.yes{background:var(--ok);color:#fff}.btn.no{background:var(--bad);color:#fff}
.btn.sm{padding:3px 10px;font-size:14px;box-shadow:0 3px 0 var(--line);border-width:2px}
.btn.big{font-size:20px;padding:12px 18px}
.icon{width:42px;height:42px;padding:0;font-size:20px;display:grid;place-items:center}

/* hub */
#hub{max-width:1080px;margin:0 auto;padding:16px 16px 100px}
.hero{display:flex;gap:12px 16px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.hero h2{font-size:clamp(24px,4vw,34px);margin:0;line-height:1.1}
.hero h2 span{background:var(--yel);padding:0 8px;border-radius:8px;border:3px solid var(--line)}
.hero p{margin:4px 0 0;color:var(--muted)}
.namebox{display:flex;gap:8px;align-items:center;background:#fff;border:3px solid var(--line);border-radius:14px;padding:4px 10px 4px 6px}
.namebox input{font:inherit;border:none;outline:none;width:190px;max-width:52vw;background:transparent}
/* hub: online hero + missions, then solo games, then feed */
.hubtop{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-bottom:16px}
@media (max-width:820px){.hubtop{grid-template-columns:1fr}}
.party-hero{background:linear-gradient(135deg,#fff 0,#fff6d8 100%)}
.cta{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start}
.cta>div{display:flex;flex-direction:column;gap:4px}
.btn.big{font-size:18px;padding:10px 18px}
a.btn{text-decoration:none;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.solo h3,.feedbox h3{margin:0 0 10px;font-size:18px}
.solo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media (max-width:820px){.solo-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:480px){.solo-grid{grid-template-columns:1fr}}
.scard{background:#fff;border:3px solid var(--line);border-radius:16px;box-shadow:0 5px 0 var(--line);padding:10px 12px;cursor:pointer;text-align:left;display:grid;grid-template-columns:52px 1fr;gap:4px 10px;align-items:center;transition:transform .12s}
.scard:hover{transform:translateY(-2px)}.scard:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.scard .em{grid-row:span 2;width:52px;height:52px;border-radius:12px;border:3px solid var(--line);background:var(--c);display:grid;place-items:center}
.scard .em img{width:42px;height:42px;object-fit:contain;image-rendering:pixelated}
.scard b{font-size:17px;line-height:1.2}
.scard small{color:var(--muted);font-size:13px}
.scard .champ{grid-column:1/-1;font-size:12.5px}
.feedbox h3{display:flex;align-items:center;gap:8px}.feedbox h3 .btn{margin-left:auto}
.credits{margin-top:14px;font-size:13px;color:var(--muted);text-align:center}
.help p{margin:6px 0}.help b{background:#ffe9a8;padding:0 4px;border-radius:4px}
#bossBtn{background:var(--yel)}
.top .btn{white-space:nowrap}
@media (max-width:720px){.top .lbl{display:none}.top{gap:6px}}
@media (max-width:560px){.top h1 span{display:none}}
/* touch screens: every control at least 44×44 */
@media (pointer:coarse),(hover:none){.btn,.btn.sm{min-height:44px;min-width:44px}.btn.icon{width:46px;height:46px}.ava-btn{min-width:44px;min-height:44px}
  input,.namebox input{min-height:44px}.credits a{display:inline-block;padding:13px 4px}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:#fff;border:3px solid var(--line);border-radius:18px;box-shadow:0 6px 0 var(--line);padding:16px;cursor:pointer;text-align:left;transition:transform .12s;display:flex;flex-direction:column;gap:8px}
.card:hover{transform:translateY(-3px) rotate(-.6deg)}
.card:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.card .em{font-family:var(--emoji);font-size:40px;width:70px;height:70px;display:grid;place-items:center;border-radius:16px;border:3px solid var(--line);background:var(--c)}
.card h3{margin:4px 0 0;font-size:21px}
.card p{margin:0;color:var(--muted);font-size:14px;flex:1}
.card .meta{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.tag{background:var(--yel);border:2px solid var(--line);border-radius:999px;padding:0 8px;font-size:12px;font-weight:600}
.tips{margin-top:22px;background:#fff;border:3px dashed var(--line);border-radius:16px;padding:14px 16px;font-size:15px}
.tips b{background:#ffe9a8;padding:0 4px;border-radius:4px}

/* stage & shared */
#stage{--chrome:180px;max-width:1680px;margin:0 auto;padding:12px 16px 40px}
.game{position:relative}
/* hub v2: three calm sections — me, party, games (+ a quiet feed) */
#hub{max-width:1040px}
#hub .me,#hub .party,#hub .scard,#hub .mpanel{background:#fff;border:2px solid var(--line);border-radius:14px;box-shadow:0 3px 0 var(--line)}
.me{display:flex;align-items:center;gap:12px;padding:8px 12px;margin-bottom:12px}
.me-ava{flex:none;width:48px;height:48px;border:2px solid var(--line);border-radius:12px;background:#f6efe4;display:grid;place-items:center;cursor:pointer;padding:0}
.me-ava img{height:40px;image-rendering:pixelated}
.me-ava canvas{height:44px;image-rendering:pixelated;margin-top:-4px}
.me-main{flex:1;min-width:0;display:grid;gap:2px}
.me-main input{font:inherit;font-weight:600;font-size:17px;border:none;border-bottom:2px dashed #d9cdbb;outline:none;background:transparent;padding:2px 0;width:100%;max-width:260px}
.me-main input:focus{border-bottom-color:var(--pri)}
.me-lv{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}.me-lv b{color:var(--ink)}
.me-lv .xpbar{width:110px;height:8px;border-width:1.5px}
.me-coins{font-weight:700;white-space:nowrap}
.party{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;margin-bottom:18px;flex-wrap:wrap}
.party-l{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
.heads{display:flex;flex-wrap:wrap;gap:6px}
.head{display:flex;align-items:center;gap:4px;background:#f6efe4;border-radius:999px;padding:2px 10px 2px 4px;font-size:13px}
.head.me{background:#fff3c4}.head img{height:24px;image-rendering:pixelated}
.party-r{display:flex;align-items:center;gap:10px}.party-r .btn{font-size:17px}.party-r .btn small{font-size:12px;font-weight:400}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}.sec-h h3{margin:0;font-size:18px}
.chip{margin-left:auto;font:inherit;font-size:14px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:3px 12px;cursor:pointer}
.chip.all{background:#e0f4d6}
.mpanel{padding:4px 12px;margin-bottom:12px}.mpanel .mlist li:last-child{border-bottom:none}
#hub .solo-grid{grid-template-columns:repeat(5,1fr);gap:10px}
@media (max-width:900px){#hub .solo-grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:520px){#hub .solo-grid{grid-template-columns:repeat(3,1fr);gap:8px}.me-coins{display:none}.party-r small{display:none}
  #hub .scard{padding:8px 4px}#hub .scard .em{width:48px;height:48px}#hub .scard .em img{width:38px;height:38px}#hub .scard b{font-size:13px;line-height:1.25}
  .me-lv .xpbar{width:56px}.me{gap:8px}}
.me-main{overflow:hidden}
#hub .scard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:12px 8px 10px}
#hub .scard:active{box-shadow:0 1px 0 var(--line)}
#hub .scard .em{width:64px;height:64px;border:none;border-radius:16px}
#hub .scard .em img{width:48px;height:48px}
#hub .scard b{font-size:15px}#hub .scard small{font-size:12px}
.head>span{display:grid;line-height:1.15}.head i{font-style:normal;font-size:11px;color:var(--muted)}
.crew{margin-top:8px}.crew h3{font-size:15px;color:var(--muted);margin:0 0 6px;display:flex;align-items:center;gap:8px}
.crew-list{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.crew-it{flex:none;display:flex;align-items:center;gap:6px;background:#fff;border:2px solid #e6dccb;border-radius:12px;padding:4px 10px 4px 6px}
.crew-it.me{border-color:var(--line);background:#fff3c4}.crew-it img{height:28px;image-rendering:pixelated}
.crew-it>span{display:grid;line-height:1.2}.crew-it b{font-size:13px}.crew-it small{font-size:11.5px;color:var(--muted);white-space:nowrap}
/* ห้องรวม */
.room-h{display:flex;align-items:center;gap:8px;margin:0 0 6px;flex-wrap:wrap}.room-h .heads{margin-left:auto}
.room{margin-bottom:16px}
.room-stage{position:relative}
.room-stage .g2box canvas{width:min(100%,calc((100dvh - 330px) * var(--ar)));min-width:min(100%,560px);cursor:pointer;background:#e8dcc8}
.room-log{position:absolute;left:10px;top:8px;max-width:45%;font-size:12.5px;pointer-events:none;z-index:2;display:grid;gap:2px}
.room-log div{background:rgba(255,255,255,.85);border-radius:8px;padding:1px 8px;width:fit-content;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.room-ov{position:absolute;inset:0;pointer-events:none;z-index:2}
.room-ov .kt{position:absolute;left:10px;top:8px;background:#fff;border:2px solid var(--line);border-radius:10px;padding:2px 10px;font-weight:800}
.room-ov .dpanel{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:min(560px,92%);text-align:center}
.room-ov .drow{display:flex;justify-content:center;gap:6px;min-height:46px;align-items:center;background:rgba(255,255,255,.9);border:3px solid var(--line);border-radius:14px;padding:4px 8px}
.room-ov .ar{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;background:#e9e2f2;font-size:24px;font-weight:800}
.room-ov .ar.rev{background:#ffd6d6;color:#c0392b}.room-ov .ar.ok{background:var(--ok);color:#fff}
.room-ov .drow.shake{animation:rshake .25s}@keyframes rshake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.room-ov .beat{position:relative;height:12px;margin:6px 4px 0;background:rgba(255,255,255,.9);border:2px solid var(--line);border-radius:8px}
.room-ov .beat i{position:absolute;top:-4px;width:6px;height:16px;margin-left:-3px;background:var(--pri);border-radius:3px}
.room-ov .beat b{position:absolute;top:-6px;width:4px;height:20px;margin-left:-2px;background:var(--ink);border-radius:2px}
.room-ov .dstat{margin-top:4px;font-size:13px;font-weight:600;text-shadow:0 0 3px #fff,0 0 3px #fff}
.room-ov .judge{font-size:36px;font-weight:800;line-height:1;margin-bottom:4px;text-shadow:0 3px 0 #fff}.room-ov .judge small{font-size:18px}.room-ov .judge .why{display:block;font-size:13px;color:var(--ink)}
.room-ov .tugbar{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.92);border:3px solid var(--line);border-radius:14px;padding:6px 10px;font-weight:800}
.room-ov .tugbar .tb{flex:1;position:relative;height:14px;border-radius:8px;background:linear-gradient(90deg,#3a86ff 0 50%,#ff5c8a 50% 100%);border:2px solid var(--line)}
.room-ov .tugbar .tb i{position:absolute;top:-7px;width:8px;height:24px;margin-left:-4px;background:#ff4d4d;border:2px solid var(--line);border-radius:3px;transition:left .1s}
.room-cnt{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:rgba(43,33,64,.35);color:#fff;pointer-events:none;z-index:3;border-radius:14px;padding:12px}
.room-cnt b{font-size:72px;line-height:1;text-shadow:0 4px 0 var(--line)}.room-cnt span{font-weight:600;text-shadow:0 2px 0 var(--line)}
.room-res{position:absolute;inset:0;display:grid;place-items:center;background:rgba(43,33,64,.45);z-index:4;border-radius:14px;padding:10px}
.room-res .panel{max-width:400px;padding:14px 18px}.room-res h2{margin:0 0 6px}.big-res{font-size:26px;font-weight:800}
.room-res .rank{text-align:left;padding-left:0;list-style:none;margin:6px 0}.room-res .rank li{display:flex;align-items:center;gap:8px;margin:3px 0}.room-res .rank img{height:28px;image-rendering:pixelated}.room-res .rank span{margin-left:auto}
.room-cnt[hidden],.room-res[hidden],.room-pad[hidden]{display:none}
.room-bar{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.room-bar input{flex:1;min-width:160px;font:inherit;border:2px solid var(--line);border-radius:12px;padding:6px 12px;background:#fff}
.room-emo{display:flex;gap:4px}
.room-pad{display:flex;gap:8px;justify-content:center;margin-top:10px}.room-pad .btn{min-width:56px;height:52px;font-size:22px}
.room-pad .btn.wide{min-width:min(360px,90%);height:60px;font-size:24px}.room-pad .btn small{font-size:13px;opacity:.8}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
@media (max-width:640px){.pick{grid-template-columns:1fr}}
.pk{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;font:inherit;color:inherit;background:#fff;border:2px solid var(--line);border-radius:14px;box-shadow:0 3px 0 var(--line);padding:10px 12px;cursor:pointer}
button.pk:hover{transform:translateY(-2px)}div.pk{cursor:default}.pk b{font-size:17px}.pk small{color:var(--muted);font-size:13px;flex:1}.pk .songs{display:flex;gap:6px;flex-wrap:wrap}
.invite{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:60;display:flex;gap:8px;align-items:center;background:#fff;border:3px solid var(--line);border-radius:14px;box-shadow:0 5px 0 var(--line);padding:8px 12px;animation:popin .25s;max-width:calc(100vw - 24px)}
@media (max-width:520px){.room-emo{display:none}}
.alerts{display:grid;gap:6px;margin-bottom:10px}.alerts:empty{display:none}
.alert{display:flex;align-items:center;gap:10px;justify-content:space-between;background:#ffe9ef;border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-size:14px}
#hub .scard{position:relative}.scard.feat{outline:3px solid var(--yel);outline-offset:-1px}
.feat-b{font-style:normal;font-size:11px;font-weight:700;background:var(--yel);border:1.5px solid var(--line);border-radius:8px;padding:0 6px}
#hub .scard .feat-b{position:absolute;top:-9px;left:50%;transform:translateX(-50%);white-space:nowrap}
.feat-note{font-weight:600;color:#8a5a00;margin:6px 0 0}
.up{margin-top:6px;font-weight:700;color:var(--ok)}
.goal{margin-top:6px;font-size:14px;background:#eef6ff;border-radius:10px;padding:4px 8px}
.tut-h{margin:4px 0 6px;font-weight:700}
.tut{display:flex;align-items:center;justify-content:center;gap:6px;margin:6px 0 10px;flex-wrap:wrap}
.tut-step{display:grid;justify-items:center;gap:4px;width:118px;animation:popin .35s both}
.tut-k{min-width:56px;height:56px;padding:0 8px;display:grid;place-items:center;font-size:26px;font-weight:800;background:#fff;border:3px solid var(--line);border-bottom-width:6px;border-radius:12px;animation:tutpress 1.6s ease-in-out infinite}
.tut-k.wide{font-size:17px}.tut-step small{font-size:12.5px;line-height:1.3}.tut-arrow{color:var(--muted);font-weight:800}
.tut-step:nth-child(3) .tut-k{animation-delay:.5s}.tut-step:nth-child(5) .tut-k{animation-delay:1s}
@keyframes tutpress{0%,60%,100%{transform:none;border-bottom-width:6px}70%{transform:translateY(3px);border-bottom-width:3px}}
.how-more{text-align:left;font-size:14px;margin-bottom:6px}.how-more summary{cursor:pointer;color:var(--blue)}
.onb-who{display:flex;gap:10px;justify-content:center;margin:10px 0}
.onb-who button{width:68px;height:80px;border:3px solid transparent;border-radius:14px;background:#f6efe4;cursor:pointer}
.onb-who button.on{border-color:var(--line);background:var(--yel)}.onb-who img{height:60px;image-rendering:pixelated}
.onb input{font:inherit;font-size:18px;width:100%;max-width:300px;border:3px solid var(--line);border-radius:12px;padding:8px 12px;text-align:center}
.onb input.err{border-color:var(--bad)}
.onb-tips{text-align:left;font-size:14px;margin:12px auto 4px;padding-left:20px;max-width:340px;color:var(--muted)}
.me{flex-wrap:nowrap}@media (max-width:520px){.me .bl{display:none}.me{flex-wrap:wrap}.me-main{flex:1 1 calc(100% - 64px)}.me>.btn{flex:1}}
.gacha-btn.free{background:var(--yel);animation:gpulse 1.2s ease-in-out infinite alternate}@keyframes gpulse{to{transform:scale(1.06)}}
.bdg{font-style:normal;font-size:11.5px;background:#fff3c4;border:1.5px solid var(--line);border-radius:8px;padding:0 6px;color:var(--ink)}
.gacha{max-width:620px}
.gm{position:relative;width:150px;height:170px;margin:4px auto 0}
.gm-dome{position:absolute;left:15px;top:0;width:120px;height:100px;border:4px solid var(--line);border-bottom:none;border-radius:60px 60px 0 0;background:#e6f4ff;display:flex;flex-wrap:wrap;align-content:flex-end;justify-content:center;gap:4px;padding:8px}
.gm-dome i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:linear-gradient(#ff5c8a 50%,#fff 50%)}
.gm-dome i:nth-child(3n){background:linear-gradient(#3a86ff 50%,#fff 50%)}.gm-dome i:nth-child(3n+1){background:linear-gradient(#ffd23f 50%,#fff 50%)}
.gm-body{position:absolute;left:5px;top:100px;width:140px;height:66px;background:#e8384f;border:4px solid var(--line);border-radius:10px}
.gm-slot{position:absolute;left:14px;top:24px;width:34px;height:22px;background:var(--line);border-radius:6px}
.gm-knob{position:absolute;right:16px;top:14px;width:36px;height:36px;border-radius:50%;background:var(--yel);border:4px solid var(--line)}
.gm-knob::after{content:'';position:absolute;left:12px;top:-2px;width:5px;height:32px;background:var(--line);border-radius:3px}
.gm-knob.turn{animation:gturn .5s ease-in-out}@keyframes gturn{to{transform:rotate(360deg)}}
.gm-cap{position:absolute;left:28px;top:118px;width:28px;height:28px;border-radius:50%;border:3px solid var(--line);background:linear-gradient(var(--c) 50%,#fff 50%);z-index:2}
.gm-cap.drop{animation:gdrop .8s cubic-bezier(.3,1.6,.5,1) forwards}@keyframes gdrop{from{transform:translateY(-30px) scale(.6)}to{transform:translateY(40px) scale(1.4)}}
.gm-cap.open{transform:translateY(40px) scale(1.4);animation:gopen .4s forwards}@keyframes gopen{to{transform:translateY(40px) scale(2.4);opacity:0;box-shadow:0 0 40px 20px var(--c)}}
.g-res{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0;min-height:10px}

<script>
'use strict';
/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem('hra_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem('hra_'+k,JSON.stringify(v))}catch(e){}}};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const pick=(r,a)=>a[Math.floor(r()*a.length)];
const rnd=Math.random;
const fmt=n=>Math.round(n).toLocaleString('th-TH');
function shuffle(r,a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const NOW=new Date();
const todayKey=`${NOW.getFullYear()}${String(NOW.getMonth()+1).padStart(2,'0')}${String(NOW.getDate()).padStart(2,'0')}`;
const todayTH=NOW.toLocaleDateString('th-TH',{day:'numeric',month:'short'});
function toast(msg){const d=document.createElement('div');d.textContent=msg;$('#toast').appendChild(d);setTimeout(()=>d.remove(),1900)}
// links pasted into LINE open in its built-in browser, where Google sign-in is blocked; this flag makes LINE use the real one
const shareURL=(q='')=>location.origin+location.pathname+'?openExternalBrowser=1'+q;
async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true}catch(e){
    const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
    let ok=false;try{ok=document.execCommand('copy')}catch(_){} ta.remove();return ok}
}

/* ---------- sound ---------- */
let actx=null,muted=store.get('muted',false);
function beep(f=440,d=.08,type='square',v=.05,slide=0){
  if(muted||bossOn)return;
  try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();
    const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.02)}catch(e){}
}
const SFX={
  good(){beep(660,.07);setTimeout(()=>beep(990,.09),60)},
  bad(){beep(170,.25,'sawtooth',.05,-90)},
  tick(){beep(900,.03,'square',.03)},
  stamp(){beep(110,.12,'triangle',.14,-50)},
  level(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.11),i*80))},
  over(){[523,392,330,262].forEach((f,i)=>setTimeout(()=>beep(f,.18,'triangle',.07),i*140))},
};
function renderMute(){$('#muteBtn').textContent=muted?'🔇':'🔊'}
$('#muteBtn').onclick=()=>{muted=!muted;store.set('muted',muted);renderMute()};

/* ---------- online services (online.js, Firebase): ranking, presence, feed ---------- */
let onlineMod=null;
const loadRank=()=>onlineMod||(onlineMod=import('./online.js?v=27'));
const loadOnline=loadRank;
const PIX_AVAS=['p_office','p_woffice','p_whealth','p_tech','p_cat','p_dog'];
const myAva=()=>{const a=store.get('partyAva','p_office');return PIX_AVAS.includes(a)?a:'p_office'};
const meWho=()=>MI_PEOPLE.includes(Prog.get().who)?Prog.get().who:'adam';
const avaSrc=a=>MI_PEOPLE.includes(a)?`assets/mi/${a}_down.png`:`assets/pixel/${PIX_AVAS.includes(a)?a:'p_office'}.png`;
const myName=()=>store.get('name','').trim();
let presState='hub';
function presence(g){if(g)presState=g;loadOnline().then(O=>O.setPresence({n:myName()||'ผู้เล่นปริศนา',a:meWho(),lv:Prog.get().lv,b:Gacha.eq(),h:Wardrobe.eq('h'),f:Wardrobe.eq('f'),u:Prog.get().lvT||0,g:bossOn?'busy':presState})).catch(()=>{})}
function ago(t){const s=Math.max(0,(Date.now()-t)/1000);return s<60?'เมื่อกี้':s<3600?Math.floor(s/60)+' นาทีที่แล้ว':s<86400?Math.floor(s/3600)+' ชม.ที่แล้ว':Math.floor(s/86400)+' วันที่แล้ว'}

/* ---------- daily missions + streak (kept on this device; everyone gets the same 3 missions each day) ---------- */
const MISSIONS=[
  {id:'spot1',t:'จับผิดภาพด่านประจำวัน ผ่าน 1 ด่าน',g:'spot',ok:e=>e.game==='spot'&&e.daily&&e.st.levels>=1},
  {id:'spot2',t:'จับผิดภาพด่านประจำวัน ผ่าน 2 ด่าน',g:'spot',ok:e=>e.game==='spot'&&e.daily&&e.st.levels>=2},
  {id:'run500',t:'วิ่งไปตอกบัตรให้ได้ 500 ม.',g:'run',ok:e=>e.game==='run'&&e.st.meters>=500},
  {id:'run20',t:'เก็บเหรียญ 20 เหรียญในรอบเดียว (วิ่งไปตอกบัตร)',g:'run',ok:e=>e.game==='run'&&e.st.coins>=20},
  {id:'whack800',t:'สายด่วนถล่มโต๊ะ ทำ 800 คะแนน',g:'whack',ok:e=>e.game==='whack'&&e.score>=800},
  {id:'whack20',t:'ทำคอมโบ 20 ในสายด่วนถล่มโต๊ะ',g:'whack',ok:e=>e.game==='whack'&&e.st.combo>=20},
  {id:'stack20',t:'ซ้อนแฟ้มให้ถึง 20 ชั้น',g:'stack',ok:e=>e.game==='stack'&&e.st.floors>=20},
  {id:'stack3',t:'วางแฟ้มเป๊ะ 3 ครั้งในรอบเดียว',g:'stack',ok:e=>e.game==='stack'&&e.st.perfects>=3},
  {id:'tug',t:'เล่นชักเย่อในห้องรวม 1 รอบ',g:'party',ok:e=>e.kind==='tug'},
  {id:'dance',t:'เต้นในห้องรวมให้จบ 1 เพลง',g:'party',ok:e=>e.kind==='dance'},
  {id:'chair',t:'วิ่งไปตอกบัตรกับเพื่อนในห้องรวม 1 รอบ',g:'party',ok:e=>e.kind==='chair'},
  {id:'mix3',t:'เล่นเกมเดี่ยวให้ครบ 3 เกม',g:'any',ok:(e,m)=>m.played.length>=3},
  {id:'tetris10',t:'Printer Tetris เคลียร์ 10 แถว',g:'tetris',ok:e=>e.game==='tetris'&&e.st.lines>=10},
  {id:'stamp10',t:'ปั๊มตรา PERFECT 10 ครั้งในรอบเดียว',g:'stamp',ok:e=>e.game==='stamp'&&e.st.perfect>=10},
  {id:'barista8',t:'บาริสต้า เสิร์ฟถูก 8 แก้ว',g:'barista',ok:e=>e.game==='barista'&&e.st.served>=8},
  {id:'toss5',t:'ปากระดาษลงถัง 5 ลูก',g:'toss',ok:e=>e.game==='toss'&&e.st.made>=5},
  {id:'slack45',t:'แอบเล่นมือถือรอดจากหัวหน้า 45 วินาที',g:'slack',ok:e=>e.game==='slack'&&e.st.secs>=45},
  {id:'conga2',t:'พาขบวนไปกินข้าวผ่าน 2 ด่าน',g:'conga',ok:e=>e.game==='conga'&&e.st.level>=3},
];
const thaiDay=(t=Date.now())=>new Date(t+7*3600e3).toISOString().slice(0,10);
function todayMissions(){
  const r=mulberry32(+thaiDay().replace(/-/g,'')*13),out=[],seen=new Set();
  for(const m of shuffle(r,MISSIONS)){if(out.length>=3)break;if(m.g!=='any'&&seen.has(m.g))continue;seen.add(m.g);out.push(m)}
  return out;
}
function mState(){const s=store.get('missions',null);return s&&s.day===thaiDay()?s:{day:thaiDay(),done:[],played:[]}}
function streakNow(){const k=store.get('streak',{last:'',n:0});return k.last===thaiDay()||k.last===thaiDay(Date.now()-864e5)?k.n:0}
function recordMission(e){ // e: {game,score,daily,st,kind}
  const s=mState(),list=todayMissions(),fresh=[];e={st:{},...e};
  if(e.game&&e.game!=='party'&&!s.played.includes(e.game))s.played.push(e.game);
  for(const m of list)if(!s.done.includes(m.id)&&m.ok(e,s)){s.done.push(m.id);fresh.push(m)}
  store.set('missions',s);
  fresh.forEach(m=>{toast('✅ ภารกิจสำเร็จ: '+m.t+' (+20 🪙)');Prog.give(20,30,'mission');Stats.econ('mission')});
  if(e.kind){Prog.give(30,60,'party');Season.add('party');Pass.add();toast('🎉 เล่นปาร์ตี้ +30 🪙')}
  if(fresh.length&&s.done.length>=list.length){
    const k=store.get('streak',{last:'',n:0}),n=k.last===thaiDay()?k.n:k.last===thaiDay(Date.now()-864e5)?k.n+1:1;
    store.set('streak',{last:thaiDay(),n});toast(`🔥 ภารกิจวันนี้ครบ! ต่อเนื่อง ${n} วัน (+40 🪙)`);Prog.give(40,80,'streak');Stats.econ('streak');
    if(myName())loadOnline().then(O=>O.pushFeed(`✅ ${myName()} ทำภารกิจวันนี้ครบ 🔥 ${n} วันติด`,myName(),meWho())).catch(()=>{});
  }
  renderMissions();
}
window.addEventListener('hra-party',e=>recordMission({game:'party',kind:e.detail.kind}));
// mission events queued by the 3D room (separate page)
{const q=store.get('pendingMissions',[]);if(q.length){store.set('pendingMissions',[]);setTimeout(()=>q.forEach(recordMission),0)}}

/* ---------- hub live panel renderers (data arrives from Firebase watchers) ---------- */
const ACT={office:'🏠 แต่งออฟฟิศ',party:'อยู่ห้องปาร์ตี้',party3d:'🎉 อยู่ห้องปาร์ตี้',hub:'อยู่ห้องรวม',village:'🏘️ อยู่ในหมู่บ้าน',busy:'🙈 แอบทำงาน',spot:'🔍 จับผิดภาพ',run:'🏃 วิ่งไปตอกบัตร',whack:'☎️ สายด่วน',stack:'📚 ซ้อนแฟ้ม',tetris:'🖨️ Printer Tetris',stamp:'🔏 ปั๊มตรา',barista:'☕ บาริสต้า',toss:'🗑️ ปากระดาษ',slack:'📱 แอบเล่นมือถือ',conga:'🍱 ขบวนไปกินข้าว'};
let onlineList=null,feedList=null;
function renderOnline(){
  const el=document.querySelector('[data-k=onlist]');if(!el)return;
  if(!onlineList){el.innerHTML='<span class="muted">กำลังเชื่อมต่อ…</span>';return}
  const L=onlineList.slice().sort((a,b)=>(b.me-a.me));
  const inRoom=L.filter(p=>p.g==='hub').length,inVil=L.filter(p=>p.g==='village').length,away=L.filter(p=>p.g!=='hub'),busy=away.length-inVil;
  document.querySelector('[data-k=oncount]').textContent=`${inRoom} คนในห้อง${inVil?` · ${inVil} คนในหมู่บ้าน`:''}${busy?` · ${busy} คนกำลังเล่นเกม`:''}`;
  el.innerHTML=away.slice(0,6).map(p=>`<span class="head${p.me?' me':''}" title="${esc(p.n)} · ${ACT[p.g]||'กำลังเล่น'}"><img src="${avaSrc(p.a)}" alt=""><span><small>${esc(p.n)}${p.g==='party3d'?' 🎉':''}</small>${p.lv?`<i>Lv${p.lv} ${Prog.title(p.lv)}</i>`:''}</span></span>`).join('')
    +(away.length>6?`<span class="muted">+${away.length-6}</span>`:'');
}
function renderFeed(){
  const el=document.querySelector('[data-k=feed]');if(!el)return;
  if(!feedList){el.innerHTML='<li class="muted">กำลังโหลด…</li>';return}
  const L=feedOpen?feedList:feedList.slice(0,3);
  el.innerHTML=L.length?L.map(f=>`<li>${f.a?`<img src="${avaSrc(f.a)}" height="22" alt="">`:'<span>📣</span>'}<span>${esc(f.m)}</span><span class="ago">${f.t?ago(f.t):''}</span></li>`).join(''):'<li class="muted">ยังเงียบอยู่ — เล่นสักเกมแล้วชื่อคุณจะขึ้นตรงนี้</li>';
}
function renderMissions(){
  const el=document.querySelector('[data-k=mlist]');if(!el)return;
  const s=mState(),list=todayMissions(),n=streakNow(),done=s.done.filter(id=>list.some(m=>m.id===id)).length;
  document.querySelector('[data-k=mcount]').textContent=`${done}/3`;
  document.querySelector('[data-k=streak]').textContent=n?`🔥${n}`:'';
  document.querySelector('#mBtn').classList.toggle('all',done>=3);
  el.innerHTML=list.map(m=>{const d=s.done.includes(m.id),g=m.g==='any'?null:m.g;
    return`<li class="${d?'done':''}"><span class="ck">${d?'✅':'⬜'}</span><span>${m.t}</span>${!d&&g?`<button class="btn sm go" data-go="${g}">เล่น</button>`:''}</li>`}).join('');
  el.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{if(b.dataset.go==='party'){HubRoom.picker()}else startGame(b.dataset.go)});
}
let crewList=null,crewT=0;
function renderCrew(){
  const el=document.querySelector('[data-k=crew]');if(!el)return;
  const me=(store.get('name','')||'').trim().toLowerCase();
  const draw=()=>{const L=(crewList||[]).slice().sort((a,b)=>(b.lv|0)-(a.lv|0)||(b.t||0)-(a.t||0)).slice(0,10);
    el.innerHTML=crewList==null?'<span class="muted">กำลังโหลด…</span>':L.length?L.map(r=>`<span class="crew-it${(r.n||'').trim().toLowerCase()===me?' me':''}"><img src="${avaSrc(r.who)}" alt=""><span><b>${r.b?badgeEmoji(r.b)+' ':''}${esc(r.n||'?')}</b><small>Lv${r.lv|0} · ${Prog.title(r.lv|0||1)}</small></span></span>`).join('')
      :'<span class="muted">ยังไม่มีใคร — ตั้งชื่อเล่นแล้วเล่นสักเกม ชื่อคุณจะขึ้นตรงนี้</span>'};
  draw();
  if(Date.now()-crewT<60000)return;crewT=Date.now();
  loadOnline().then(O=>O.listProfiles(40)).then(L=>{crewList=L;draw()}).catch(()=>{crewList=crewList||[];draw()});
}
function partyInvite(G,name){
  const d=document.createElement('div');d.className='invite';
  d.innerHTML=`<span>🎉 <b>${esc(G.by||'เพื่อน')}</b> เปิด ${name} ในห้องรวม!</span><button class="btn sm primary">เข้าร่วม</button><button class="btn sm" aria-label="ปิด">✕</button>`;
  const [go,x]=d.querySelectorAll('button');go.onclick=()=>{d.remove();store.set('hubView','room');goHome()};x.onclick=()=>d.remove();
  document.body.appendChild(d);setTimeout(()=>d.remove(),15000);
}
/* ---------- เกมแนะนำวันนี้: same pick for everyone, pays double coins ---------- */
function featuredId(){const L=GAMES.filter(g=>!g.online&&!g.noFeat),d=thaiDay().replace(/\D/g,'');return L[(+d*2654435761>>>0)%L.length].id}
/* ---------- first-play tutorials: 3 picture steps, shown the first time each game opens ---------- */
const TUT={
  spot:[['👀','ดูภาพซ้าย-ขวา'],['👆','แตะจุดที่ต่างกัน'],['⏱','หาให้ครบก่อนหมดเวลา']],
  run:[['⎵','Space / แตะ = กระโดด'],['↓','ลูกศรลง = ก้มหลบเครื่องบิน'],['🪙','เก็บเหรียญ ไปให้ไกลที่สุด']],
  whack:[['👆','แตะงานที่โผล่ขึ้นมา'],['🙅','อย่าตีหัวหน้า!'],['🔥','ตีต่อเนื่อง = คอมโบ']],
  stack:[['📦','แฟ้มเลื่อนไปมา'],['⎵','Space / แตะ = วาง'],['🎯','วางให้ตรง กองไม่เล็กลง']],

// a few coins fly from (x,y) into the coin counter `to`, which then bumps — feedback for every payout
function flyCoins(x,y,to,n){
  if(!to||!(n>0)||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const T=to.getBoundingClientRect(),k=Math.min(8,Math.max(3,Math.round(n/25)));
  for(let i=0;i<k;i++){const c=document.createElement('i');c.className='fly-coin';c.textContent='🪙';c.style.left=x+'px';c.style.top=y+'px';document.body.appendChild(c);
    const dx=T.left+T.width/2-x,dy=T.top+T.height/2-y,sx=(Math.random()-.5)*80;
    c.animate([{transform:'translate(0,0) scale(.6)',opacity:0},{transform:`translate(${sx}px,-30px) scale(1.1)`,opacity:1,offset:.25},{transform:`translate(${dx}px,${dy}px) scale(.7)`,opacity:.9}],
      {duration:650+i*70,easing:'cubic-bezier(.5,0,.7,1)'}).onfinish=()=>{c.remove();to.classList.remove('bump');void to.offsetWidth;to.classList.add('bump')}}
}

const SPOT_ROOMS=[['wall_mint','floor_herring'],['wall_yellow','floor_wood'],['wall_pink','floor_dwood'],['wall_grey','floor_teal'],['wall_beige','floor_yellow'],['wall_wood','floor_brick']];
const SPOT_ALL=Object.values(SPOT_CAT).flat();
// "family" = same object in another colour (or the same pose by another person)
const COLOR_RE=/(red|blue|white|beige|grey|dark|light|gold|green|lilac|brown|yellow|pink|cream|adam|alex|amelia|bob)/;
const famKey=n=>n.replace(COLOR_RE,'#').replace(/\d+$/,'');
function colorVariant(r,n){if(!COLOR_RE.test(n))return null;const fam=SPOT_ALL.filter(m=>m!==n&&famKey(m)===famKey(n));return fam.length?pick(r,fam):null}
function buildScene(r,lv){
  const it=[],[wall,floor]=pick(r,SPOT_ROOMS);
  const add=(cat,x,yb,n)=>{const [w,h]=MI_SZ[n];it.push({cat,n,x,yb,w:w*SPX,h:h*SPX,flip:cat!=='wall'&&cat!=='people'&&r()<.4})};
  const row=(cats,yb,gap)=>{for(let x=3+r()*5;;){const cat=pick(r,cats),n=pick(r,SPOT_CAT[cat]),w=MI_SZ[n][0]*SPX;if(x+w>98)break;add(cat,x+w/2,yb+r()*2,n);x+=w+gap+r()*(7-Math.min(lv,5))}};
  // wall: windows and pictures hung along the wall
  for(let x=4+r()*5;;){const n=pick(r,SPOT_CAT.wall),[w,h]=MI_SZ[n];if(x+w*SPX>97)break;add('wall',x+w*SPX/2,5+h*SPX+r()*4,n);x+=w*SPX+3+r()*(9-Math.min(lv,6))}
  row(['big','big','seat','lamp','small','desk'],SPOT_WALL_H+5,2);   // against the wall
  row(['seat','desk','chair','people','lamp','small'],53,3);           // middle of the room
  row(['people','chair','small','desk','lamp','people','small'],72,3); // front

}
function makeDiffs(r,items,n,lv){
  const subtle=Math.min(1,(lv-1)/5),out=[];
  for(const it of shuffle(r,items)){
    if(out.length>=n)break;
    const cy0=it.yb-it.h/2;
    if(out.some(d=>Math.hypot(d.it.x-it.x,(d.it.yb-d.it.h/2)-cy0)<10))continue;
    const ops=['remove','swap'];const cv=colorVariant(r,it.n);if(cv)ops.push('color','color');
    if(lv>=2)ops.push('size');if(lv>=3){ops.push('move');if(it.cat!=='wall')ops.push('flip')}
    const op=pick(r,ops),d={it,op,side:r()<.5?0:1};
    if(op==='swap'){const pool=SPOT_CAT[it.cat].filter(m=>famKey(m)!==famKey(it.n)&&MI_SZ[m][0]*SPX<it.w+12);d.n=pick(r,pool.length?pool:SPOT_CAT.small)}
    if(op==='color')d.n=cv;
    if(op==='size')d.sc=r()<.5?1.4-.12*subtle:.65+.1*subtle;
    if(op==='move')d.dx=(r()<.5?-1:1)*(5-1.5*subtle);
    d.cx=it.x+(d.dx||0)/2;d.cy=cy0;d.rad=Math.max(4.5,Math.max(it.w,it.h)*.55)+2+Math.abs(d.dx||0)/2;
    out.push(d);
  }
  return out;
}
function renderPanel(p,scene,diffs,side){
  const [fw,fh]=MI_SZ[scene.floor]||[16,16];
  let h=`<div class="wallband" style="background-color:${WALL_COL[scene.wall]};background-image:url(${MDIR}${scene.wall}.png);background-size:${16*SPX}cqw ${32*SPX}cqw;height:${SPOT_WALL_H}cqw"></div>
    <div class="floorbg" style="top:${SPOT_WALL_H}cqw;background-image:url(${MDIR}${scene.floor}.png);background-size:${fw*SPX*1.5}cqw ${fh*SPX*1.5}cqw"></div>`;
  for(const it of scene.items){
    const d=diffs.find(d=>d.it===it&&d.side===side);
    let n=it.n,x=it.x,sc=1,flip=it.flip;
    if(d){if(d.op==='remove')continue;if(d.op==='swap'||d.op==='color')n=d.n;if(d.op==='size')sc=d.sc;if(d.op==='move')x+=d.dx;if(d.op==='flip')flip=!flip}
    const w=MI_SZ[n][0]*SPX,hh=MI_SZ[n][1]*SPX;
    h+=`<img class="sp" alt="" src="${MDIR}${n}.png" style="left:${x-w/2}cqw;top:${it.yb-hh}cqw;width:${w}cqw;transform:scale(${flip?-sc:sc},${sc})">`;
  }
  p.innerHTML=h;
}

      const m=meters();if(m-lastQuip>=400){lastQuip=m;api.toast(`${m} ม. — ${pick(rnd,RUN_QUIPS)}`);fx.text(W/2,120,`${m} ม.!`,{color:PAL.yel,size:30})}
      hud();
    }else if(over){p.vy+=G*dt;p.y=Math.min(H+120,p.y+p.vy*dt)}
    draw();
  });
  cv.addEventListener('pointerdown',e=>{e.preventDefault();const R=cv.getBoundingClientRect();
    if(e.clientX-R.left<R.width*.35)p.duck=true;else jump()});
  const up=()=>{p.duck=false;release()};
  window.addEventListener('pointerup',up);
  const keyUp=e=>{if([' ','ArrowUp','w','W'].includes(e.key))release();if(['ArrowDown','s','S'].includes(e.key))p.duck=false};
  window.addEventListener('keyup',keyUp);
  api.onKey(e=>{if([' ','ArrowUp','w','W'].includes(e.key)){e.preventDefault();if(!e.repeat)jump()}
    else if(['ArrowDown','s','S'].includes(e.key)){e.preventDefault();p.duck=true}});
  hud();draw();
  api.intro({how:`<p>🏃 วิ่งไปตอกบัตรให้ทัน! <b>กระโดด</b>ข้ามลัง เก้าอี้ล้อเลื่อน เพื่อนที่วิ่งสวน · <b>ก้ม</b>หลบเครื่องบินกระดาษ</p>
      <p>👆 แตะฝั่ง <b>ขวา</b> / Space = กระโดด (กดซ้ำกลางอากาศ = 2 ชั้น) · แตะฝั่ง <b>ซ้าย</b>ค้าง / ↓ = ก้ม</p>
      <p>${pxImg('coin',18)} เหรียญ +10 คะแนน · ${pxImg('gem',18)} +10 เหรียญ · ❤️ 3 ดวง ชนครบ = จบ</p><p>👇 เลือกตัวละครแล้วออกวิ่งเลย</p>`,
    buttons:MI_PEOPLE.map(c=>({label:`<img class="pxi" src="${MDIR}${c}_right.png" height="44" alt="${c}" style="display:block">`,primary:c===who,
      go(){who=c;store.set('runWho',c);running=true}}))});
  return{destroy(){window.removeEventListener('pointerup',up);window.removeEventListener('keyup',keyUp)}};
}

/* =================================================================
   GAME 3 — สายด่วนถล่มโต๊ะ (whack-a-mole over office cubicles)
================================================================= */
function whackGame(root,api){
  const KEYS=['7','8','9','4','5','6','1','2','3'],ALT=['q','w','e','a','s','d','z','x','c'];
  const legend=`${pixImg('alex_phone',26)}${pixImg('papers',26)} +10 · ${pixImg('papers2',26)} งานด่วน +30 · ${pixImg('cake_slice',22)} +3 วิ · <b>${pixImg('bob_down',26)} หัวหน้า ห้ามตี!</b>`;
  root.innerHTML=`<div class="hud"><div class="timer" data-k="tm"><div data-k="bar"></div></div><span>⏱ <b data-k="t">40</b></span><span>⭐ <b data-k="sc">0</b></span><span data-k="combo" class="muted"></span></div>
    <div class="legend">${legend}</div>
    <div class="wgrid">${KEYS.map((k,i)=>`<div class="hole" data-i="${i}"><span class="key">${k}</span><div class="mole"></div></div>`).join('')}</div>`;
  const q=k=>root.querySelector(`[data-k="${k}"]`),grid=root.querySelector('.wgrid');
  const holes=[...root.querySelectorAll('.hole')].map(el=>({el,mole:el.querySelector('.mole'),obj:null,life:0,cool:0}));
  // art: an animated character sheet (anim) or a still sprite (img)
  const T={phone:{anim:'phone',cap:'โทรมา!',pts:10,life:1.4},paper:{img:'papers',cap:'เอกสาร',pts:10,life:1.5},
    fire:{img:'papers2',cap:'ด่วน!',pts:30,life:.8,hot:1},boss:{anim:'boss',cap:'หัวหน้า',pts:0,life:1.5},coffee:{img:'cake_slice',cap:'+3 วิ',pts:0,life:1}};
  const TOTAL=40,BONUS_MAX=25;let bonus=0,time=TOTAL,sc=0,combo=0,best=0,spawnT=.4,el=0,running=false;
  function hud(){q('t').textContent=Math.ceil(time);q('sc').textContent=fmt(sc);q('bar').style.width=Math.min(100,time/TOTAL*100)+'%';q('tm').classList.toggle('low',time<8);
    const m=1+Math.floor(combo/6)*.5;q('combo').textContent=combo>=3?`🔥 คอมโบ ${combo}${m>1?' (x'+m+')':''}`:''}
  function pickType(){const w=[['phone',40],['paper',25],['fire',10+el*.15],['boss',10+el*.45],['coffee',bonus>=BONUS_MAX?0:time<15?9:4]];
    let s=w.reduce((a,b)=>a+b[1],0)*rnd();for(const [t,v] of w){if((s-=v)<0)return t}return 'phone'}
  function art(t){const d=T[t];
    if(d.anim==='phone')return`<div class="mia ph" style="background-image:url(${MDIR}chars/${pick(rnd,['adam','alex','amelia'])}_phone.png)"></div>`;
    if(d.anim==='boss')return`<div class="mia boss" style="background-image:url(${MDIR}chars/bob_idle_anim.png)"></div>`;
    return`<img alt="" class="pxi${d.hot?' hot':''}" src="${MDIR}${d.img}.png">`}
  function spawn(){const empty=holes.filter(h=>!h.obj&&h.cool<=0);if(!empty.length)return;const h=pick(rnd,empty),t=pickType();
    h.obj=t;h.life=T[t].life*Math.max(.55,1-el/70);h.mole.innerHTML=`${art(t)}<small>${T[t].cap}</small>`;h.el.classList.add('up');h.el.classList.toggle('isboss',t==='boss')}
  function hide(h){h.obj=null;h.cool=.15;h.el.classList.remove('up','isboss')}
  function float(h,txt,cls=''){const f=document.createElement('div');f.className='float '+cls;f.textContent=txt;h.el.appendChild(f);setTimeout(()=>f.remove(),700)}
  function hit(i){
    if(!running||api.paused)return;const h=holes[i];if(!h.obj)return;const t=h.obj,R=h.el.getBoundingClientRect();
    h.mole.classList.remove('bonk');void h.mole.offsetWidth;h.mole.classList.add('bonk');
    if(t==='boss'){sc=Math.max(0,sc-40);combo=0;runSfx('hurt');api.toast('😡 ตีหัวหน้าทำไม! −40');float(h,'−40','bad');domShake(grid,10);domFlash(h.el)}
    else if(t==='coffee'){const cb=Math.min(3,BONUS_MAX-bonus);bonus+=cb;time+=cb;runSfx('gem');float(h,`+${cb} วิ`);domBurst(h.el,R.width/2,R.height*.45,{n:8,colors:['#fff',PAL.yel]})}
    else{combo++;best=Math.max(best,combo);const p=Math.round(T[t].pts*(1+Math.floor(combo/6)*.5));sc+=p;runSfx('coin');float(h,'+'+p);
      domBurst(h.el,R.width/2,R.height*.45,{n:t==='fire'?16:10,colors:t==='fire'?[PAL.red,PAL.orange,PAL.yel]:CONFETTI});
      if(combo%10===0){api.toast(`🔥 คอมโบ ${combo}!`);domShake(grid,4)}
      const bt=Math.min(BONUS_MAX-bonus,(t==='fire'?1:0)+(combo%5===0?1:0));if(bt>0){bonus+=bt;time+=bt;setTimeout(()=>float(h,bonus>=BONUS_MAX?'⏱ โบนัสเต็ม!':`⏱ +${bt} วิ`,'time'),120)}}
    h.obj=null;h.cool=.2;setTimeout(()=>{if(!h.obj)h.el.classList.remove('up','isboss')},180);hud();
  }
  holes.forEach((h,i)=>h.el.addEventListener('pointerdown',e=>{e.preventDefault();hit(i)}));
  api.onKey(e=>{const k=e.key.toLowerCase();let i=KEYS.indexOf(k);if(i<0)i=ALT.indexOf(k);if(i>=0){e.preventDefault();hit(i)}});
  api.loop(dt=>{if(!running)return;el+=dt;time-=dt;spawnT-=dt;
    if(spawnT<=0){spawn();if(el>12&&rnd()<.35)spawn();spawnT=Math.max(.36,.9-el*.014)}
    for(const h of holes){h.cool-=dt;if(h.obj){h.life-=dt;if(h.life<=0){if(h.obj!=='boss'&&h.obj!=='coffee')combo=0;hide(h)}}}
    if(time<=0){time=0;running=false;hud();holes.forEach(hide);api.end(sc,`คอมโบสูงสุด ${best}`,false,{combo:best})}else hud()});
  hud();
  api.intro({how:`<p>☎️ เพื่อนโทรเข้า เอกสาร และงานด่วนโผล่ขึ้นมาหลังพาร์ทิชัน — <b>ตีให้ไว!</b></p>
      <p>${legend}</p>
      <p>⏱ ตีงานด่วน +1 วิ · ตีติดกันทุก 5 ครั้ง +1 วิ · เค้ก +3 วิ — เวลาโบนัสรวมได้สูงสุด +25 วิ</p>
      <p>⚠️ ตีหัวหน้าโดน −40 และคอมโบหาย</p>
      <p>⌨️ ใช้คีย์ <b>ตัวเลข 1-9</b> (แบบ numpad) หรือ <b>Q W E / A S D / Z X C</b> ได้</p>`,
    buttons:[{label:'📞 รับสาย!',primary:true,go(){running=true}}]});
}

/* =================================================================
   GAME 4 — ซ้อนแฟ้มเสียดฟ้า (stacker)
================================================================= */
function stackGame(root,api){
  root.innerHTML=`<div class="hud"><span>🏢 ชั้น <b data-k="sc">0</b></span><span>✨ วางเป๊ะ <b data-k="pf">0</b></span><span class="muted">แตะจอ / Space เพื่อวางแฟ้ม</span></div><div class="stack-box"><canvas></canvas></div>`;
  const q=k=>root.querySelector(`[data-k="${k}"]`),cv=root.querySelector('canvas'),ctx=cv.getContext('2d'),fx=makeFX();
  const W=360,H=560,BH=26,BASE_Y=H-70,ROOM=14;
  const dpr=Math.min(2,window.devicePixelRatio||1);cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  const LAB=['รายงาน','ใบเสนอราคา','สัญญา','บันทึกประชุม','งบประมาณ','แผนงาน','ใบแจ้งหนี้','โปรเจกต์','สรุปยอดขาย','คู่มือ','นโยบาย','ใบสั่งซื้อ'];
  const COL=['#3a86ff','#ff5c8a','#21c07a','#ff9f1c','#8338ec','#00b4d8','#ffd23f','#e23030'];
  const DECO=[[17,'cloud',70],[22,'cloud',270],[26,'plane',110],[31,'cloud',90],[36,'plane',250],[42,'moon',280],[48,'spark',80],[56,'rocket',260],[70,'ufo',120],[90,'spark',220]];
  let who=store.get('runWho','adam');if(!MI_PEOPLE.includes(who))who='adam';
  const STOPS=[[0,[120,198,242]],[14,[150,210,250]],[28,[255,170,130]],[38,[60,40,110]],[48,[14,12,40]]];
  let stack=[{x:80,w:200,c:'#9b6a45',lab:'โต๊ะทำงาน'}],cur,cam=0,debris=[],combo=0,perf=0,over=false,running=false,hop=0,t=0;
  function newBlock(){const top=stack[stack.length-1],n=stack.length,fl=n%2===1;
    cur={w:top.w,x:fl?-top.w:W,dir:fl?1:-1,sp:Math.min(390,150+n*7),c:COL[n%COL.length],lab:LAB[n%LAB.length]}}
  newBlock();
  const yOf=lv=>BASE_Y-lv*BH+cam;
  function bg(){const h=(cam/BH)+8;let a=STOPS[0],b=STOPS[STOPS.length-1];
    for(let i=0;i<STOPS.length-1;i++)if(h>=STOPS[i][0]&&h<STOPS[i+1][0]){a=STOPS[i];b=STOPS[i+1];break}
    const k=h>=b[0]?1:(h-a[0])/(b[0]-a[0]);return a[1].map((v,i)=>Math.round(v+(b[1][i]-v)*k))}
  // one binder lying flat: coloured body, highlight, spine label
  function folder(b,y,alpha=1){
    ctx.globalAlpha=alpha;
    ctx.fillStyle=PAL.ink;ctx.fillRect(b.x,y,b.w,BH);
    ctx.fillStyle=b.c;ctx.fillRect(b.x+2,y+2,b.w-4,BH-4);
    ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(b.x+2,y+2,b.w-4,3);ctx.fillStyle='rgba(0,0,0,.18)';ctx.fillRect(b.x+2,y+BH-6,b.w-4,4);
    if(b.w>58){const lw=Math.min(b.w-26,104);ctx.fillStyle='rgba(255,255,255,.92)';ctx.fillRect(b.x+(b.w-lw)/2,y+6,lw,BH-12);
      ctx.fillStyle=PAL.ink;ctx.font='600 12px Kanit, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(b.lab,b.x+b.w/2,y+BH/2,lw-6)}
    ctx.globalAlpha=1}
  function draw(){
    fx.pre(ctx);
    const c=bg();ctx.fillStyle=`rgb(${c})`;ctx.fillRect(-20,-20,W+40,H+40);
    if(cam>30*BH){ctx.fillStyle='rgba(255,255,255,.8)';for(let i=0;i<40;i++){const sx=(i*97)%W,sy=((i*53+cam*.3)%H);ctx.fillRect(sx,sy,2,2)}}
    // the office the stack starts in: a wall with windows up to floor ROOM, then open sky
    const wallTop=yOf(ROOM),fy=yOf(0)+BH;
    if(wallTop<H){ctx.fillStyle=WALL_COL.wall_grey;ctx.fillRect(0,Math.max(-20,wallTop),W,fy-wallTop);
      ctx.fillStyle=PAL.ink;ctx.fillRect(0,wallTop-4,W,4);
      [['window_big',70,5],['window_big',290,5],['pic_land',180,9],['window_grey',70,10],['window_grey',290,10]].forEach(([n,x,lv])=>{const y=yOf(lv);if(y>-80&&y<H+40)drawPixAt(ctx,n,x,y,3)});
      drawPixAt(ctx,'plant_pot',30,fy,3);drawPixAt(ctx,'shelf_white',330,fy,3)}
    for(const [lv,e,x] of DECO){const y=yOf(lv);if(y<-40||y>H+40)continue;drawPixAt(ctx,pxa(e),x+Math.sin(t+lv)*6,y,e==='cloud'?4:3)}
    if(fy<H){const ft=pix('floor_wood');if(ft.complete&&ft.naturalWidth){ctx.imageSmoothingEnabled=false;for(let yy=fy,r=0;yy<H;yy+=48,r++)for(let x=-(r*48)%144;x<W;x+=144)ctx.drawImage(ft,x,yy,144,48)}}
    for(let i=0;i<stack.length;i++){const y=yOf(i);if(y>H||y<-BH)continue;folder(stack[i],y)}
    {const top=stack[stack.length-1],cx=top.x+top.w/2,by=yOf(stack.length-1)-Math.sin(hop*Math.PI)*18;
      if(over)drawChar(ctx,who,'idle_anim','down',t,cx,by,2,{rot:.8});
      else drawChar(ctx,who,hop>0?'run':'idle_anim','down',t,cx,by,2,{sx:1-hop*.1,sy:1+hop*.12})}
    if(!over&&running)folder(cur,yOf(stack.length));
    for(const d of debris){ctx.save();ctx.translate(d.x+d.w/2,d.y+BH/2);ctx.rotate(d.rot);folder({...d,x:-d.w/2},-BH/2,.9);ctx.restore()}
    fx.post(ctx,W,H);
  }
  function hud(){q('sc').textContent=stack.length-1;q('pf').textContent=perf}
  function drop(){
    if(!running||over||api.paused)return;
    const top=stack[stack.length-1],L=Math.max(cur.x,top.x),R=Math.min(cur.x+cur.w,top.x+top.w),y=yOf(stack.length);
    if(R-L<=0){debris.push({...cur,y,vy:0,rot:0,vr:cur.dir*2});over=true;api.sfx('bad');fx.shake(8,.35);fx.flash(PAL.red,.25);
      api.after(1.1,()=>api.end(stack.length-1,`วางเป๊ะ ${perf} ครั้ง`,false,{floors:stack.length-1,perfects:perf}));return}
    if(Math.abs(cur.x-top.x)<5){combo++;perf++;let w=top.w;if(combo>=3)w=Math.min(220,w+10);
      stack.push({x:top.x-(w-top.w)/2,w,c:cur.c,lab:cur.lab});hop=1;api.sfx('level');
      fx.text(W/2,y-14,combo>=3?`เป๊ะ x${combo}!`:'เป๊ะ!',{color:PAL.yel,size:combo>=3?32:28});fx.shake(3,.12);
      fx.burst(top.x+top.w/2,y+BH/2,{n:12,colors:[PAL.yel,'#fff'],speed:240,grav:0,size:6,shape:'star',life:.45,spread:Math.PI,dir:-Math.PI/2})}
    else{combo=0;
      if(cur.x<top.x)debris.push({...cur,x:cur.x,w:top.x-cur.x,y,vy:0,rot:0,vr:-1.5});
      else debris.push({...cur,x:R,w:cur.x+cur.w-R,y,vy:0,rot:0,vr:1.5});
      stack.push({x:L,w:R-L,c:cur.c,lab:cur.lab});hop=1;api.sfx('stamp');fx.shake(2,.1);
      fx.burst(cur.x<top.x?L:R,y+BH,{n:6,colors:['#fff','#e8dcc8'],speed:90,grav:-30,size:6,shape:'puff',life:.4})}
    const fl=stack.length-1;if(fl%10===0){fx.text(W/2,H/2-60,`🏢 ชั้น ${fl}!`,{color:PAL.pink,size:34,life:1.3});fx.burst(W/2,H/2-60,{n:28,colors:CONFETTI,speed:320,grav:500,size:6,shape:'paper',life:1})}
    newBlock();hud();
  }
  cv.addEventListener('pointerdown',e=>{e.preventDefault();drop()});
  api.onKey(e=>{if(e.key===' '||e.key==='Enter'||e.key==='ArrowDown'){e.preventDefault();drop()}});
  api.loop(dt=>{
    const d=fx.step(dt);t+=dt;
    if(running&&!over&&d){cur.x+=cur.dir*cur.sp*d;if(cur.dir>0&&cur.x>W-cur.w*.5)cur.dir=-1;else if(cur.dir<0&&cur.x<-cur.w*.5)cur.dir=1}
    const target=Math.max(0,(stack.length-13)*BH);cam+=(target-cam)*Math.min(1,dt*6);
    for(const o of debris){o.vy+=1000*dt;o.y+=o.vy*dt;o.rot+=o.vr*dt}
    debris=debris.filter(o=>o.y<H+120);hop=Math.max(0,hop-dt*3);draw();
  });
  draw();hud();
  api.intro({how:`<p>📦 แฟ้มเลื่อนไปมา — <b>แตะจอ</b> หรือกด <b>Space</b> เพื่อวางลงบนกอง</p>
      <p>✂️ ส่วนที่ล้นจะถูกตัดทิ้ง แฟ้มเลยแคบลงเรื่อยๆ</p><p>✨ วาง <b>เป๊ะ</b> ติดกัน 3 ครั้ง แฟ้มจะกว้างขึ้น</p><p>🚀 ซ้อนสูงพอ… อาจทะลุหลังคาไปถึงอวกาศ</p>`,
    buttons:[{label:'📚 เริ่มซ้อน!',primary:true,go(){running=true}}]});
}

let feedOpen=false;
function showHelp(){
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="panel popin help" style="text-align:left"><h2 style="text-align:center">❓ วิธีเล่น</h2>
    <p>🙈 <b>หัวหน้าเดินมา?</b> กด <b>Esc</b> (หรือ <b>\`</b>) หรือปุ่ม 🙈 มุมขวาล่าง → จอกลายเป็นไฟล์ Excel ทะเบียนวันลาทันที เกมหยุด เสียงเงียบ ชื่อแท็บเปลี่ยน</p>
    <p>↩️ กลับมาเล่นต่อ: กด <b>Esc</b> อีกครั้ง หรือแตะคำว่า <b>"พร้อม"</b> ที่มุมซ้ายล่างของ Excel</p>
    <p>🏆 คะแนนส่งเข้า<b>อันดับรวม</b>อัตโนมัติตอนจบเกม ใช้ชื่อเล่นด้านบน — อย่าใช้ชื่อซ้ำกับเพื่อน</p>
    <p>🎯 ภารกิจวันนี้ทุกคนได้ชุดเดียวกัน ทำครบ 3 ข้อ = 🔥 ต่อเนื่อง</p>
    <p>📋 จบเกมแล้วกด "อวดในไลน์" เพื่อคัดลอกคะแนนไปแปะในกลุ่ม</p>
    <p>🚶 <b>ห้องรวม</b>: คลิกพื้นหรือกดลูกศรเพื่อเดิน · Enter แล้วพิมพ์คุย · กด 🎉 เล่นปาร์ตี้ = ทุกคนในห้องเล่นด้วยกัน (เต้น / ชักเย่อ / วิ่งไปตอกบัตร) · 🔗 ชวน = คัดลอกลิงก์ไปแปะในไลน์</p>
    <p>🎰 <b>กาชา</b>: ตู้หน้าห้องรวม หมุนฟรีวันละครั้ง · ได้ป้ายติดข้างชื่อ กับเฟอร์นิเจอร์ชุดทอง (มีแต่ในตู้) · ป้ายซ้ำได้แสตมป์ไว้แลกป้ายที่อยากได้</p>
    <p>⭐ <b>เกมแนะนำวันนี้</b> ได้เหรียญ ×2 — เปลี่ยนทุกวัน ทุกคนได้เกมเดียวกัน</p>
    <p>🌱 <b>ฟาร์มดาดฟ้า</b>: ปลูกผัก (3 นาที – 3 ชม.) เก็บใส่ตะกร้าเมื่อว่าง แล้วขาย ส่งโรงอาหาร หรือส่งให้เพื่อน · ผักไม่มีวันเหี่ยว · ขยายห้อง = แปลงเพิ่ม (4 → 10) · ผักที่สุกตอนฝนตก แดดทอง หรือรุ้ง จะกลายพันธุ์ ขายได้แพงขึ้น · ทุกคนมีผลไม้ประจำตัว 1 อย่างที่ปลูกได้คนเดียว</p>
    <p>🏠 <b>ออฟฟิศของฉัน</b>: ทุกเกมและภารกิจได้ 🪙 กับ XP · เลเวลขึ้นได้ฉายาใหม่และปลดล็อกของ · เอาเหรียญไปซื้อเฟอร์นิเจอร์แต่งห้อง เพื่อนเข้ามาดูและกดถูกใจได้ (ถูกใจ 1 ครั้ง = +5 🪙)</p>
    <div class="row"><button class="btn primary">เข้าใจแล้ว</button></div></div>`;
  ov.onclick=e=>{if(e.target===ov||e.target.closest('button'))ov.remove()};document.body.appendChild(ov);
}
$('#helpBtn').onclick=showHelp;
// what reaching new levels gave you (results screen) and what the next title brings (me bar)
function unlockHTML(rw){if(!rw.ups.length)return'';const ids=Wardrobe.unlockedBetween(rw.before.lv,rw.after.lv),nt=Prog.title(rw.after.lv)!==Prog.title(rw.before.lv);
  if(!ids.length&&!nt)return'';return`<div class="unlock">${nt?`<span>📜 ฉายาใหม่ <b>${Prog.title(rw.after.lv)}</b></span>`:''}${ids.map(id=>`<span><img src="${Wardrobe.icon(id)}" alt=""> ซื้อได้แล้ว <b>${ACC[id][1]}</b> · 🪙 ${fmt(Wardrobe.price(id))}</span>`).join('')}${ids.length?'<button class="btn sm" data-a="dress">👕 ไปซื้อ</button>':''}</div>`}
function nextHint(lv){const id=Wardrobe.nextUnlock(lv),tl=TITLES.find(([l])=>l>lv);if(!id&&!tl)return'';const at=Math.min(id?ACC[id][2]:99,tl?tl[0]:99);
  return`<small class="nx bl">ถัดไป Lv ${at}: ${tl&&tl[0]===at?tl[1]:''}${id&&ACC[id][2]===at?` <img src="${Wardrobe.icon(id,2)}" alt="${ACC[id][1]}" title="${ACC[id][1]}">`:''}</small>`}
// me-bar avatar with the equipped accessories (retries until the sprite sheet has loaded)
function drawAva(cv,n=0){const x=cv.getContext('2d'),who=meWho();x.clearRect(0,0,40,64);drawChar(x,who,'idle_anim','down',0,20,64,2);
  for(const sl of['f','h'])drawAcc(x,Wardrobe.eq(sl),who,'idle_anim','down',0,20,64,2);if(n<30&&!pix('chars/'+who+'_idle_anim').complete)setTimeout(()=>drawAva(cv,n+1),100)}
// ripe crops waiting in your garden: a quiet number on the farm button, never a popup
function farmBadge(){const b=hub.querySelector('[data-k=farmN]');if(!b)return;const n=Farm.ready();b.hidden=!n;b.textContent=n}
setInterval(()=>{if(!hub.hidden)farmBadge()},20000);
function renderHub(){
  const solo=GAMES.filter(g=>!g.online),P=Prog.get(),mOpen=store.get('mOpen',false);
  hub.innerHTML=`<section class="me">
      <button class="me-ava" id="avaBtn" type="button" title="แต่งตัว" aria-label="แต่งตัว"><canvas id="avaCv" width="40" height="64"></canvas></button>
      <div class="me-main"><input id="nameIn" maxlength="20" placeholder="ตั้งชื่อเล่นก่อนเล่น ✏️" aria-label="ชื่อเล่น">
        <div class="me-lv"><b>Lv ${P.lv}</b> ${Prog.title(P.lv)}${Gacha.eq()?` <i class="bdg">${badgeTxt(Gacha.eq())}</i>`:''} <span class="xpbar"><i style="width:${P.xp/needXP(P.lv)*100}%"></i></span>${nextHint(P.lv)}</div></div>
      <nav class="me-nav" aria-label="ของฉัน">
        <button class="gacha-btn${Gacha.freeToday()?' free':''}" id="gachaBtn" type="button" aria-label="กาชา">🎰<span class="bl">กาชา</span></button>
        <button id="officeBtn" type="button" aria-label="ห้องฉัน">🏠<span class="bl">ห้องฉัน</span></button>
        <button class="farm-btn" id="farmBtn" type="button" aria-label="ฟาร์ม">🌱<span class="bl">ฟาร์ม</span><i class="farm-n" data-k="farmN" hidden></i></button>
        <button class="cloud-btn${Cloud.nudge()?' dot':''}" id="cloudBtn" type="button" aria-label="เซฟ" title="${Cloud.title()}">☁️<span class="bl">เซฟ</span></button>
      </nav>
      <span class="me-coins">🪙 ${fmt(P.coins)}</span>
    </section>
    <div class="alerts" data-k="alerts"></div>
    <div class="room-h"><span class="seg"><button class="on" data-view="room" type="button">🏠 ห้องรวม</button><button data-view="tower" type="button">🏢 ตึกออฟฟิศ</button>${Village.on()?'<button data-view="village" type="button">🏘️ หมู่บ้าน</button>':''}</span><span class="dot"></span><span class="muted" data-k="oncount"></span><div class="heads" data-k="onlist"></div><button class="off-bar" id="offBar" type="button"></button></div>
    <div data-k="room"></div><div data-k="tower"></div><div data-k="village"></div>
    <section class="solo"><div class="sec-h"><h3>เกม</h3><button class="btn primary play-cta" id="playFeat" type="button">▶ เล่น${GAMES.find(g=>g.id===featuredId()).title} <small>🪙×2</small></button><button class="chip" id="mBtn" type="button" aria-expanded="${mOpen}">🎯 ภารกิจวันนี้ <b data-k="mcount">0/3</b> <span data-k="streak"></span> ${mOpen?'▴':'▾'}</button><button class="chip sea-chip" id="ladBtn" type="button" title="Season Pass">🎫</button><button class="chip sea-chip" id="seaBtn" type="button" title="ภารกิจฤดูกาล">🏆<span class="sea-l"> ฤดูกาล</span> <b>${Season.done(Season.get())}/${SEASON_CH.length}</b></button></div>
      <div class="mpanel"${mOpen?'':' hidden'}><ul class="mlist" data-k="mlist"></ul></div>
      <div class="solo-grid">${solo.map(g=>{const b=store.get('best_'+g.id,0),ft=g.id===featuredId();return`<button class="scard${ft?' feat':''}" data-g="${g.id}" title="${g.desc}">${ft?'<i class="feat-b">⭐ วันนี้ 🪙×2</i>':''}<span class="em" style="--c:${g.color}"><img src="${g.img}" alt=""></span>
        <b>${g.title}</b><small>${b?`🏆 ${fmt(b)}${g.unit?' '+g.unit:''}`:g.time}</small></button>`}).join('')}</div></section>
    <section class="crew"><h3>เพื่อนร่วมออฟฟิศ <button class="linkbtn" id="crewMore">ดูห้องเพื่อน</button></h3><div class="crew-list" data-k="crew"></div></section>
    <section class="awards"><h3>🏆 รางวัลออฟฟิศ <small>ประกาศผลทุกวันจันทร์</small><button class="linkbtn" id="awShare" type="button" hidden>📋 อวดในไลน์</button></h3><div class="aw-grid" data-k="aw"></div></section>
    <section class="feedbox"><h3>ความเคลื่อนไหว <button class="linkbtn" id="feedMore">${feedOpen?'ย่อ':'ดูทั้งหมด'}</button></h3><ul class="feed" data-k="feed"></ul></section>
    <p class="credits">🎨 <a href="https://limezu.itch.io/moderninteriors" target="_blank" rel="noopener">LimeZu Modern Interiors</a> (ฟรี ไม่แสวงหากำไร) · เสียง 3D และหมู่บ้าน: <a href="https://kenney.nl" target="_blank" rel="noopener">Kenney</a> (CC0, Tiny Town / Tiny Farm) · <a href="https://2dpig.itch.io/pixel-office" target="_blank" rel="noopener">2dPig</a> (CC0)</p>`;
  const ni=$('#nameIn');ni.value=store.get('name','');let nt=0;ni.oninput=()=>{store.set('name',ni.value);clearTimeout(nt);nt=setTimeout(()=>{presence();Prog.sync()},800)};

  $('#cloudBtn').onclick=()=>Cloud.open();

  $('#feedMore').onclick=()=>{feedOpen=!feedOpen;$('#feedMore').textContent=feedOpen?'ย่อ':'ดูทั้งหมด';renderFeed()};
  $('#crewMore').onclick=()=>{window.officeTab='friends';startGame('office');window.officeTab=null};
  presence(Village.on()&&store.get('hubView','room')==='village'?'village':'hub');startLive();renderOnline();renderFeed();renderMissions();renderCrew();beatenAlerts().catch(()=>{});
  hub.querySelectorAll('.scard').forEach(c=>c.onclick=()=>startGame(c.dataset.g));

renderHub();
onboarding();
Cloud.boot();Stats.boot();$('#newsBtn').onclick=News.open;News.boot();setTimeout(roomNews,2500);setTimeout(claimCups,3500);
if(/[?&]join=room/.test(location.search)){Tower.setView('room');setTimeout(()=>{document.getElementById('room')?.scrollIntoView({behavior:'smooth',block:'center'});
  const G=HubRoom.G;toast(G.sc&&G.sc!=='lobby'&&G.sc!=='res'?'🎉 เพื่อนกำลังเล่นอยู่ในห้องรวม — รอบหน้าเล่นด้วยกัน!':'👋 เพื่อนชวนมาที่ห้องรวม ทักทายกันได้เลย')},600)}
// test-mode hook for verify/run.py (absent for normal visits)
if(window.__TEST__)window.__app={open:id=>startGame(id),home:()=>goHome(),start:()=>{const b=document.querySelector('.overlay .btn.primary');b&&b.click()},
  state:()=>({screen:hub.hidden?(current&&current.g.id):'hub',started:!!(current&&current.started),ended:!!(current&&current.ended)})};
