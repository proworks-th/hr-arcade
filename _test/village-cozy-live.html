<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Cozy Village Sample</title>
<link rel="icon" href="data:,">
<style>
:root{--ink:#3b2316;--pink:#ff6fa8;--card:#fff8ec;--muted:#7a5c48}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#4f8a3a;font-family:Kanit,"Leelawadee UI",Tahoma,sans-serif;color:var(--ink)}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
.chip{position:absolute;background:var(--card);border:3px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink);padding:5px 12px;font-weight:600;font-size:14px}
#title{left:12px;top:12px}
#clock{left:12px;top:60px;display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 6px 3px 12px}
#clock input{width:120px}
#clock button{min-height:44px;min-width:44px;font:inherit;font-size:12px;font-weight:700;border:2px solid var(--ink);border-radius:10px;background:#fff;color:var(--ink);cursor:pointer}
#clock button.on{background:#ffd54a}
.side{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.btn{min-width:44px;min-height:44px;font:inherit;font-weight:700;font-size:15px;background:var(--card);border:3px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink);cursor:pointer;color:var(--ink);padding:0 10px}
.tag{position:absolute;transform:translate(-50%,-100%);background:var(--card);border:2px solid var(--ink);border-radius:9px;padding:0 7px;font-size:12px;font-weight:600;white-space:nowrap;pointer-events:none}
.tag.me{background:#ffe066}.tag.npc{background:#e3f1ff}.tag.lot{background:#efe4d0;font-weight:500;font-size:11px;color:var(--muted)}
.bub{position:absolute;transform:translate(-50%,-100%);background:#fff;border:2px solid var(--ink);border-radius:12px;padding:3px 9px;font-size:13px;max-width:230px;pointer-events:none;text-align:center}
.pop{position:absolute;transform:translate(-50%,-100%);font-weight:800;font-size:16px;color:#e8467c;text-shadow:0 2px 0 #fff,0 -1px 0 #fff;pointer-events:none;transition:transform 1.2s ease-out,opacity 1.2s}
#card{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(460px,calc(100% - 32px));max-height:calc(100% - 130px);overflow:auto;background:var(--card);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:12px 14px;display:none;z-index:4}
.chip,.side{z-index:3}
#card h3{margin:0;font-size:18px}
#card .sub{margin:0;color:var(--muted);font-size:13px}
#card .say{margin:8px 0;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:6px 10px;font-size:14px}
#card .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
#card button{min-height:44px;font:inherit;font-weight:700;border:3px solid var(--ink);border-radius:14px;cursor:pointer;background:#fff;color:var(--ink)}
#card .row>button{flex:1}
#card .pri{background:var(--pink);color:#fff}
#card button:disabled{opacity:.45;cursor:default}
.head{display:flex;gap:10px;align-items:center}
.head canvas{width:48px;height:96px;image-rendering:pixelated;background:#e3f1ff;border:2px solid var(--ink);border-radius:12px;height:72px;object-fit:cover}
.hearts{font-size:17px;letter-spacing:1px;margin-top:2px}
.lvl{font-size:12px;color:var(--muted)}
.gifts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.gifts button{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:600;padding:3px;min-height:58px;position:relative}
.gifts img{width:27px;height:24px;image-rendering:pixelated}
.gifts .n{position:absolute;right:5px;top:2px;font-size:11px;color:var(--muted)}
.gifts .h{position:absolute;left:4px;top:1px;font-size:11px}
.likes{font-size:13px;margin-top:8px}
.unl{list-style:none;margin:8px 0 0;padding:0;font-size:13px}
.unl li{display:flex;gap:8px;align-items:center;padding:4px 0;border-top:1px dashed #d9c4a8}
.unl li.ok{color:#2f7d3a;font-weight:600}
.unl li.lock{color:var(--muted)}
.fr{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:6px 10px;margin-top:6px;font-weight:600!important}
.fr canvas{width:24px;height:48px;image-rendering:pixelated}
.fr small{display:block;color:var(--muted);font-weight:400}
#toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:6px 14px;font-size:14px;display:none;white-space:nowrap;z-index:5}
#credit{position:absolute;left:12px;bottom:10px;font-size:11px;color:#fffc;text-shadow:0 1px 2px #0008}
@media (max-width:600px){#title small{display:none}#clock input{width:90px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="chip" id="title">🏘️ หมู่บ้าน <small style="font-weight:400;color:var(--muted)">· ตัวอย่างหน้าตาใหม่</small></div>
<div class="chip" id="clock">🕒 <b id="tm"></b><input id="hour" type="range" min="6" max="23.5" step=".5" aria-label="ดูเวลาอื่น"><button id="real" type="button" class="on">เวลาจริง</button></div>
<div class="side">
  <button class="btn" id="friends" type="button">💗 เพื่อนบ้าน</button>
  <button class="btn" id="zin" type="button" aria-label="ซูมเข้า">＋</button>
  <button class="btn" id="zout" type="button" aria-label="ซูมออก">－</button>
</div>
<div id="card"></div>
<div id="toast"></div>
<div id="credit">Art: Tiny Farm RPG (free) by Maeve Devs · ตัวละคร/ผัก: HR Arcade</div>
<script>
'use strict';
(async () => {
/* ============ assets: the pack + our own avatars and crops (read from the live code so they always match) ============ */
const img = src => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error('missing ' + src)); i.src = src; });
const S = Object.fromEntries(await Promise.all(['grass', 'house', 'maple', 'fences'].map(async n => [n, await img('farmrpg/' + n + '.png')])));
const WHO = ['adam', 'alex', 'amelia', 'bob'], CH = {};
await Promise.all(WHO.flatMap(w => ['run', 'idle_anim'].map(async a => { CH[w + a] = await img('../assets/mi/chars/' + w + '_' + a + '.png'); })));
const [farmSrc, soloSrc] = await Promise.all(['../farm.js', '../solo-games.js'].map(u => fetch(u).then(r => r.text())));
const CROPS = new Function('return {' + farmSrc.split('const CROPS = {')[1].split('\n};')[0] + '}')();
const PAL = new Function('return {' + soloSrc.split('const PXA_PAL = {')[1].split('};')[0] + '}')();
const STAGE_ART = { seed: ['..........', '...c..c...', '..cCccCc..', '.cCCCCCCc.'], sprout: ['.gg...gg.', 'gggg.gggg', '.gGGgGGg.', '...GgG...', '....G....', '....G....'],
  grow: ['..g..g..g..', '.ggg.g.ggg.', 'ggGggGggGgg', '.gGgGgGgGg.', '..gGGGGGg..', '...gGGGg...', '....GGG....', '....G.G....'] };
const pxCache = {};
function pxa(rows) { const key = rows.join('|'); if (pxCache[key]) return pxCache[key];
  const c = document.createElement('canvas'); c.width = Math.max(...rows.map(r => r.length)); c.height = rows.length; const g = c.getContext('2d');
  rows.forEach((r, y) => [...r].forEach((ch, x) => { if (ch !== '.') { g.fillStyle = PAL[ch]; g.fillRect(x, y, 1, 1); } })); return (pxCache[key] = c); }
const cropArt = id => pxa(CROPS[id][5]), cropName = id => CROPS[id][0];
const cropURL = {}; const cropImg = id => cropURL[id] ??= (() => { const s = cropArt(id), c = document.createElement('canvas'); c.width = s.width * 3; c.height = s.height * 3;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false; g.drawImage(s, 0, 0, c.width, c.height); return c.toDataURL(); })();

/* ============ the live map: same size, roads, plaza, tower and 12 lots as village.js ============ */
const T = 16, C = 48, R = 34, O = '#3b2316';
const rnd = (s => () => (s = s * 16807 % 2147483647) / 2147483647)(7);
const ri = n => Math.floor(rnd() * n);
const G = Array.from({ length: R }, () => Array(C).fill(1)), block = Array.from({ length: R }, () => Array(C).fill(0));
const setG = (x, y, v) => { if (G[y] && G[y][x] !== undefined) G[y][x] = v; };
for (let x = 0; x < C; x++) { setG(x, 9, 0); setG(x, 10, 0); }
for (let y = 7; y < 31; y++) { setG(22, y, 0); setG(34, y, 0); }
for (const y of [16, 23, 30]) for (let x = 1; x <= 46; x++) setG(x, y, 0);
for (let y = 11; y <= 17; y++) for (let x = 1; x <= 9; x++) setG(x, y, 3);
setG(5, 7, 3); setG(5, 8, 3);
const TOWER = { x: 1, y: 1, w: 8 }, BOARD = [8, 12], WELL = [5, 13];
for (let y = 1; y <= 6; y++) for (let x = 1; x <= 8; x++) block[y][x] = 1;

const STAGE_TH = ['ว่าง', 'จองที่ดินแล้ว', 'บ้านหลังแรก', 'บ้านหลังใหญ่', 'สวน 14 แปลง', 'ขึ้นบ้านใหม่'];
const ROOFS = { blue: '#8796ad', red: null, green: '#5f9e4f', purple: '#8b6bbf', brown: '#8a5a3c', pink: '#e98bab', teal: '#3f9e9b', navy: '#3d4f8a' };
const WALLS = { wood: null, stone: '#aab3c0', white: '#efe7da', yellow: '#f2cf63', mint: '#a9dcc4', peach: '#f4b38c' };
const LOTS = [];
[4, 12, 19, 26].forEach(y => [11, 23, 35].forEach(x => LOTS.push({ id: LOTS.length + 1, x, y, stage: 0 })));
// a showcase of every stage and some paint colours (the real game reads these from rooms/_vil/lots)
const SHOW = [[5, 'แพร', 'blue', 'wood', 'tmo', 'tom'], [3, 'เอก', 'red', 'wood', '', 'car', 1], [0], [2, 'ฝน', 'green', 'white', 'o', 'let'],
  [5, 'พล', 'pink', 'peach', 'fmpo', 'chi'], [1, 'จอย', '', '', '', 'bok'], [4, 'ต้น', 'navy', 'stone', 'p', 'cor', 1], [2, 'เบียร์', 'red', 'wood', '', 'bok', 1],
  [0], [5, 'มิ้นท์', 'teal', 'mint', 'to', 'wat'], [2, 'ปุ๊ก', 'purple', 'yellow', 'm', 'pum'], [0]];
LOTS.forEach((L, i) => { const [stage, owner, rc, wc, xs, crop, b] = SHOW[i]; Object.assign(L, { stage, owner, rc: rc || 'red', wc: wc || 'wood', xs: xs || '', crop: crop || 'bok', building: !!b, pct: .35 + i * .04 }); });
const MY = LOTS[4];
for (const L of LOTS) { setG(L.x + 2, L.y + 3, 3); }

/* ============ grass autotile: quadrants picked from the pack's grass sheet by shape ============ */
const ga = (() => { const c = document.createElement('canvas'); c.width = S.grass.width; c.height = S.grass.height; const g = c.getContext('2d'); g.drawImage(S.grass, 0, 0); return g.getImageData(0, 0, c.width, c.height); })();
const alphaAt = (x, y) => ga.data[(y * ga.width + x) * 4 + 3] > 0 ? 1 : 0;
function qStats(tx, ty, q) { const fx = q & 1, fy = q >> 1, px = (u, v) => alphaAt(tx * 16 + (fx ? 15 - u : u), ty * 16 + (fy ? 15 - v : v));
  let eH = 0, eV = 0, co = 0, core = 0;
  for (let i = 3; i < 8; i++) for (let j = 0; j < 2; j++) { eH += 1 - px(i, j); eV += 1 - px(j, i); }
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) co += 1 - px(i, j);
  for (let i = 3; i < 8; i++) for (let j = 3; j < 8; j++) core += 1 - px(i, j);
  return [eH / 10, eV / 10, co / 4, core / 25]; }
const WANT = { full: [0, 0, 0, 0], outer: [1, 1, 1, 0], h: [1, 0, .6, 0], v: [0, 1, .6, 0], inner: [0, 0, 1, 0] }, QPICK = {};
for (const [k, w] of Object.entries(WANT)) for (let q = 0; q < 4; q++) { let best = 1e9, at = null;
  for (let ty = 0; ty < 4; ty++) for (let tx = 0; tx < 12; tx++) { const s = qStats(tx, ty, q), d = s.reduce((a, v, i) => a + (v - w[i]) ** 2 * (i === 3 ? 4 : 1), 0); if (d < best) { best = d; at = [tx, ty]; } }
  QPICK[k + q] = at; }
const grassAt = (x, y) => x < 0 || y < 0 || x >= C || y >= R ? true : G[y][x] === 1;

/* ============ houses: the pack cottage / big house, roof + walls repainted for the lot's paint ============ */
const hexRGB = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function paint(src, roof, wall) {        // roof reds above the eaves → roof colour; cream planks → wall colour
  const c = document.createElement('canvas'); c.width = src.width; c.height = src.height; const g = c.getContext('2d'); g.drawImage(src, 0, 0);
  if (!roof && !wall) return c;
  const d = g.getImageData(0, 0, c.width, c.height), p = d.data, eave = c.height - 37, R0 = roof && hexRGB(roof), W0 = wall && hexRGB(wall);
  for (let i = 0; i < p.length; i += 4) { if (!p[i + 3]) continue; const r = p[i], gg = p[i + 1], b = p[i + 2], y = (i / 4 / c.width) | 0, l = (r + gg + b) / 3;
    if (R0 && y < eave && r > gg * 1.5 && r > b * 1.8 && r > 60) { const f = Math.min(1.45, l / 92); p[i] = R0[0] * f; p[i + 1] = R0[1] * f; p[i + 2] = R0[2] * f; }
    else if (W0 && r > 190 && gg > 150 && b > 120 && r - b < 90) { const f = l / 196; p[i] = Math.min(255, W0[0] * f); p[i + 1] = Math.min(255, W0[1] * f); p[i + 2] = Math.min(255, W0[2] * f); } }
  g.putImageData(d, 0, 0); return c; }
const cottageRaw = (() => { const c = document.createElement('canvas'); c.width = 72; c.height = 95; c.getContext('2d').drawImage(S.house, 148, 3, 72, 95, 0, 0, 72, 95); return c; })();
const bigRaw = (() => { const c = document.createElement('canvas'); c.width = 72; c.height = 95; const g = c.getContext('2d');
  g.drawImage(S.house, 90, 64, 13, 30, 46, 0, 13, 30);
  g.drawImage(S.house, 4, 3, 72, 86, 0, 9, 72, 86);
  g.drawImage(S.house, 112, 3, 32, 23, 20, 72, 32, 23);
  g.drawImage(S.house, 81, 8, 14, 13, 4, 65, 14, 13); g.drawImage(S.house, 81, 8, 14, 13, 54, 65, 14, 13);
  return c; })();
const houseCache = {};
const houseFor = L => { const big = L.stage >= 3 && !(L.stage === 3 && L.building), k = (big ? 'b' : 'c') + L.rc + L.wc;
  return houseCache[k] ??= paint(big ? bigRaw : cottageRaw, ROOFS[L.rc], WALLS[L.wc]); };

/* ============ hand-drawn bits in the pack's style (dark outline, warm wood) ============ */
function sprite(w, h, fn) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); fn(g, (x, y, ww, hh, col) => { g.fillStyle = col; g.fillRect(x, y, ww, hh); }); return c; }
const SIGN = sprite(14, 16, (g, r) => { r(6, 6, 2, 10, O); r(0, 0, 14, 9, O); r(1, 1, 12, 7, '#c98b54'); r(1, 1, 12, 2, '#e0a76c'); r(3, 4, 8, 1, '#7a4a2c'); });
const STAKE = sprite(4, 9, (g, r) => { r(1, 0, 2, 9, O); r(1, 0, 1, 8, '#c98b54'); r(0, 0, 4, 2, '#e05a5a'); });
const JAR = sprite(10, 12, (g, r) => { r(1, 2, 8, 10, O); r(2, 3, 6, 8, '#a8613a'); r(3, 0, 4, 3, O); r(3, 4, 2, 4, '#c98b54'); });
const LANTERN = sprite(8, 22, (g, r) => { r(3, 6, 2, 16, O); r(0, 0, 8, 8, O); r(1, 1, 6, 6, '#ffd36b'); r(2, 2, 2, 2, '#fff4c2'); r(1, 20, 6, 2, O); });
const BOARD_S = sprite(28, 26, (g, r) => { r(3, 10, 3, 16, O); r(22, 10, 3, 16, O); r(0, 0, 28, 17, O); r(1, 1, 26, 15, '#9c5b34'); r(1, 1, 26, 3, '#b97a45');
  r(4, 5, 7, 8, '#fff4e0'); r(13, 4, 6, 7, '#ffe3f0'); r(20, 6, 5, 7, '#e3f1ff'); r(6, 7, 3, 1, '#7a5c48'); r(14, 6, 4, 1, '#7a5c48'); });
const WELL_S = sprite(26, 30, (g, r) => { r(1, 0, 24, 6, O); r(2, 1, 22, 4, '#c4553c'); r(3, 6, 2, 12, O); r(21, 6, 2, 12, O);
  r(0, 16, 26, 14, O); r(1, 17, 24, 12, '#aab3c0'); for (let i = 0; i < 4; i++) r(1 + i * 6 + (i % 2) * 2, 20 + (i % 2) * 4, 1, 4, '#7d8796'); r(3, 17, 20, 3, '#3f86c4'); });
const LAMP = sprite(8, 30, (g, r) => { r(3, 8, 2, 22, O); r(1, 28, 6, 2, O); r(0, 0, 8, 9, O); r(1, 1, 6, 7, '#ffe9a8'); });
const SCAFF = sprite(80, 70, (g, r) => { for (const x of [2, 74]) r(x, 0, 4, 70, O), r(x + 1, 0, 2, 70, '#c98b54');
  for (const y of [18, 44]) r(0, y, 80, 4, O), r(0, y + 1, 80, 2, '#d9a066'); });
const FOUND = sprite(64, 30, (g, r) => { r(0, 6, 64, 24, O); r(1, 7, 62, 22, '#b07a4a'); for (let i = 0; i < 6; i++) r(3 + i * 10, 9, 8, 18, '#c98b54'), r(3 + i * 10, 9, 8, 2, '#e0a76c');
  r(0, 0, 4, 30, O); r(60, 0, 4, 30, O); });
const BRICKS = sprite(18, 10, (g, r) => { r(0, 2, 18, 8, O); for (let i = 0; i < 3; i++) r(1 + i * 6, 3, 5, 3, '#c4553c'); for (let i = 0; i < 2; i++) r(4 + i * 6, 6, 5, 3, '#a8442f'); r(4, 0, 10, 3, O); r(5, 0, 8, 2, '#c4553c'); });
const tower = (() => { const w = 8 * T, h = 6 * T; return sprite(w, h + 14, (g, r) => {
  r(2, 10, w - 4, h + 2, O); r(4, 12, w - 8, h - 2, '#efdcb8'); r(4, 12, 6, h - 2, '#e2c99c');
  r(0, 0, w, 14, O); r(2, 2, w - 4, 10, '#c4553c'); r(2, 2, w - 4, 3, '#d96d4f');
  for (let row = 0; row < 3; row++) for (let k = 0; k < 6; k++) { const x = 12 + k * 19, y = 20 + row * 19; r(x - 1, y - 1, 12, 12, O); r(x, y, 10, 10, '#7fb6dc'); r(x, y, 10, 3, '#b9dcf2'); r(x + 4, y, 1, 10, O); }
  r(w / 2 - 13, h - 18, 26, 28, O); r(w / 2 - 11, h - 16, 22, 26, '#9c5b34'); r(w / 2, h - 16, 1, 26, '#7a4527');
  r(w / 2 - 22, h - 27, 44, 9, O); r(w / 2 - 21, h - 26, 42, 7, '#ffd54a'); }); })();

/* ============ world objects (y-sorted together with people) ============ */
const objs = [], glows = [];
const add = (y, draw, extra = {}) => objs.push({ y, draw, ...extra });
const MAPLE = { big: [96, 1, 32, 46], mid: [71, 14, 20, 33], sap: [43, 34, 9, 12] };
function tree(x, y, k = 'big') { const r = MAPLE[k], bx = x * T + 8, by = y * T + 14; block[y][x] = 1;
  add(by, g => g.drawImage(S.maple, r[0], r[1], r[2], r[3], bx - r[2] / 2 | 0, by - r[3], r[2], r[3]), { shadow: [bx, by - 1, k === 'big' ? 11 : 6] }); }
const fence = (x, y, k) => { block[y][x] = 1; add(y * T + 14, g => g.drawImage(S.fences, k * 16, 32, 16, 16, x * T, y * T, 16, 16)); };
const at = (spr, cx, by, opt) => add(by, g => g.drawImage(spr, Math.round(cx - spr.width / 2), by - spr.height), opt);

add(7 * T + 4, g => g.drawImage(tower, TOWER.x * T, 7 * T - tower.height + 4), { shadow: [5 * T, 7 * T + 2, 60] });
for (let k = 0; k < 3; k++) for (let j = 0; j < 6; j++) glows.push([TOWER.x * T + 17 + j * 19, 25 + k * 19 + 7 * T - tower.height + 4, 10, .2]);
at(BOARD_S, BOARD[0] * T + 8, BOARD[1] * T + 15); block[BOARD[1]][BOARD[0]] = 1;
at(WELL_S, WELL[0] * T + 8, WELL[1] * T + 15, { shadow: [WELL[0] * T + 8, WELL[1] * T + 14, 13] }); block[WELL[1]][WELL[0]] = 1;
for (const [x, y] of [[1, 11], [9, 11], [1, 17], [9, 17]]) { at(LAMP, x * T + 8, y * T + 14); block[y][x] = 1; glows.push([x * T + 8, y * T - 10, 26, .55]); }

const gCells = L => { const n = L.stage >= 5 || (L.stage === 4 && !L.building) ? 14 : 10; return Array.from({ length: n }, (_, i) => [L.x + 5 + i % 5, L.y + Math.floor(i / 5)]); };
function lot(L) {
  const X = L.x, Y = L.y, cx = (X + 2) * T + 8, by = (Y + 3) * T + 2, has = c => L.xs.includes(c);
  if (!L.stage) { at(SIGN, cx, (Y + 1) * T + 14); block[Y + 1][X + 2] = 1; L.tag = 'ว่าง · จองได้'; return; }
  // the farm lives on the lot from จองที่ดิน on: beds + crops at every stage

const card = document.getElementById('card'), toastEl = document.getElementById('toast');
let toastT; const toast = m => { toastEl.textContent = m; toastEl.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => toastEl.style.display = 'none', 2400); };
function say(P, text, ms = 2800, pop) { const el = document.createElement('div'); el.className = pop ? 'pop' : 'bub'; el.textContent = text; document.body.append(el);
  bubbles.push({ P, el, until: performance.now() + ms, pop }); if (pop) requestAnimationFrame(() => { el.style.transform = 'translate(-50%,-180%)'; el.style.opacity = '0'; }); }
const face = (who, k = 3) => { const c = document.createElement('canvas'); c.width = 16 * k; c.height = 32 * k; const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  g.drawImage(CH[who + 'idle_anim'], 18 * 16, 0, 16, 32, 0, 0, 16 * k, 32 * k); return c; };
const heartRow = N => { const h = hearts(N); return '❤️'.repeat(h) + '🤍'.repeat(10 - h); };
let openN = null, openGift = false;
const closeCard = () => { card.style.display = 'none'; card.onclick = null; openN = null; };
function npcCard(N, giftOpen) { openN = N; openGift = !!giftOpen;
  const h = hearts(N), tier = h >= 7 ? 2 : h >= 3 ? 1 : 0, line = N.say[tier][(N.p / 7 | 0) % 2], weekLeft = 2 - N.gn;
  const likeTxt = id => `<img src="${cropImg(id)}" style="width:18px;height:16px;image-rendering:pixelated;vertical-align:-3px"> ${cropName(id)}`;
  const known = [N.loves, ...N.likes].map(id => N.known.includes(id) ? (id === N.loves ? '😍 ' : '😊 ') + likeTxt(id) : '❔ ???').join(' · ');
  card.innerHTML = `<div class="head"><span data-face></span><div style="flex:1"><h3>${N.n}</h3><p class="sub">${N.role} · ตอนนี้: ${N.at[2]}</p>
      <div class="hearts">${heartRow(N)}</div><div class="lvl">ระดับ ${h}/10 · ${N.p.toLocaleString()} / 2,500 แต้ม</div></div></div>
    <div class="say">“${line}”</div>
    <div class="row"><button class="pri" data-a="talk" ${N.td ? 'disabled' : ''}>💬 ${N.td ? 'คุยแล้ววันนี้' : 'ทักทาย +20'}</button><button data-a="gift" ${weekLeft <= 0 ? 'disabled' : ''}>🎁 ให้ผัก ${weekLeft}/2</button><button data-a="x" style="flex:0 0 64px">ปิด</button></div>
    ${giftOpen && weekLeft > 0 ? `<div class="gifts">${Object.keys(INV).map(id => `<button data-g="${id}" ${INV[id] ? '' : 'disabled'}>${N.known.includes(id) ? `<span class="h">${id === N.loves ? '😍' : '😊'}</span>` : ''}<span class="n">×${INV[id]}</span><img src="${cropImg(id)}" alt="">${cropName(id)}</button>`).join('')}</div>` : ''}
    <div class="likes">ของที่ชอบ: ${known}</div>
    <ul class="unl">${N.unl.map(([k, t]) => `<li class="${h >= k ? 'ok' : 'lock'}">${h >= k ? '✅' : '🔒'} ❤️${k} · ${t}</li>`).join('')}</ul>`;
  card.querySelector('[data-face]').replaceWith(face(N.who));
  card.style.display = 'block';
  card.onclick = e => { const b = e.target.closest('button'); if (!b || b.disabled) return;
    if (b.dataset.a === 'x') return closeCard();
    if (b.dataset.a === 'talk') { N.td = true; addPts(N, 20); say(N.P, line); return npcCard(N); }
    if (b.dataset.a === 'gift') return npcCard(N, true);
    if (b.dataset.g) give(N, b.dataset.g); };
}
function addPts(N, n) { const before = hearts(N); N.p = Math.min(2500, N.p + n); say(N.P, '+' + n + ' ❤️', 1300, true); N.P.el.textContent = tagOf(N); if (openN === N) npcCard(N, openGift);
  const after = hearts(N); if (after > before) { const u = N.unl.find(([k]) => k === after); setTimeout(() => toast(u ? `💗 ${N.n} ❤️${after} · ปลดล็อก ${u[1]}` : `💗 สนิทกับ${N.n}ขึ้น ❤️${after}`), 600); } }
function give(N, id) { if (!INV[id] || N.gn >= 2) return; INV[id]--; N.gn++;
  const add = id === N.loves ? 80 : N.likes.includes(id) ? 45 : 20; if (add > 20 && !N.known.includes(id)) N.known.push(id);
  say(N.P, add === 80 ? `${cropName(id)}! ชอบที่สุดเลย 😍` : add === 45 ? 'ขอบใจนะ ชอบเลย 😊' : 'ขอบใจจ้ะ', 2600);
  setTimeout(() => addPts(N, add), 250); npcCard(N, true); }
function friendsCard() { openN = null;
  card.innerHTML = `<h3>💗 เพื่อนบ้าน</h3><p class="sub">ทักทายวันละครั้ง · ให้ผักได้สัปดาห์ละ 2 ครั้ง · หัวใจไม่ลดลงเอง</p>
    ${NPCS.map((N, i) => `<button class="fr" data-n="${i}"><span data-f="${i}"></span><span style="flex:1">${N.n}<small>${N.at[2]} · ${N.td ? 'ทักแล้ววันนี้' : 'ยังไม่ได้ทักวันนี้'}</small></span><span style="font-size:13px">❤️ ${hearts(N)}/10</span></button>`).join('')}
    <div class="row"><button data-a="x">ปิด</button></div>`;
  card.querySelectorAll('[data-f]').forEach(s => s.replaceWith(face(NPCS[+s.dataset.f].who, 2)));
  card.style.display = 'block';
  card.onclick = e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.a === 'x') return closeCard();
    if (b.dataset.n) { const N = NPCS[+b.dataset.n]; go(me, cellOf(N.P)); npcCard(N); } };
}
function lotCard(L) { openN = null;
  const st = L.stage ? STAGE_TH[L.stage] + (L.building ? ' (กำลังสร้าง)' : '') : 'ที่ดินว่าง';
  card.innerHTML = `<h3>${L.stage ? (L === MY ? '🏠 บ้านของฉัน' : '🏠 บ้าน' + L.owner) : '🪧 ที่ดินแปลง ' + L.id}</h3><p class="sub">${st}${L.stage ? ' · สวน ' + gCells(L).length + ' แปลง (' + cropName(L.crop) + ')' : ' · จองแล้วสร้างบ้านได้'}</p>
    <div class="row"><button class="pri" data-a="x">${!L.stage ? '🪧 จองที่ดิน 10,000' : L === MY ? '🌱 เข้าสวนของฉัน' : '💧 ช่วยรดน้ำ'}</button><button data-a="x">ปิด</button></div>
    <p class="sub" style="margin-top:6px">ตัวอย่างนี้ปุ่มยังไม่ทำงาน · ของจริงใช้ระบบสร้างบ้านเดิมทั้งหมด</p>`;
  card.style.display = 'block'; card.onclick = e => { if (e.target.closest('[data-a=x]')) closeCard(); };
}

/* ============ input ============ */
function pick(wx, wy) {
  for (const N of NPCS) if (Math.abs(N.P.px - wx) < 10 && wy > N.P.py - 30 && wy < N.P.py + 4) return { npc: N };
  for (const L of LOTS) { const cx = (L.x + 2) * T + 8, by = (L.y + 3) * T + 2;
    if (L.stage >= 2 && Math.abs(cx - wx) < 36 && wy < by && wy > by - 90) return { lot: L };
    if (wx >= L.x * T && wx < (L.x + 10) * T && wy >= L.y * T && wy < (L.y + 3) * T) return { lot: L }; }
  return null; }
cv.addEventListener('pointerdown', e => {
  const wx = e.clientX / SC + view.ox, wy = e.clientY / SC + view.oy, hit = pick(wx, wy);
  if (hit?.npc) { go(me, cellOf(hit.npc.P)); return npcCard(hit.npc); }
  if (hit?.lot) { go(me, [hit.lot.x + 2, hit.lot.y + 3]); return lotCard(hit.lot); }
  closeCard(); go(me, [Math.floor(wx / T), Math.floor(wy / T)]);
});
const KEYS = { arrowup: [0, -1], w: [0, -1], arrowdown: [0, 1], s: [0, 1], arrowleft: [-1, 0], a: [-1, 0], arrowright: [1, 0], d: [1, 0] };
addEventListener('keydown', e => { const k = KEYS[e.key.toLowerCase()]; if (k) { held.add(k); e.preventDefault(); } });
addEventListener('keyup', e => { const k = KEYS[e.key.toLowerCase()]; if (k) held.delete(k); });
document.getElementById('friends').onclick = friendsCard;

/* ============ start ============ */
setHour(real ? thaiNow() : hour);
for (const N of NPCS) { const s = spotOf(N, hour)[1], c = near(...s); N.P.px = c[0] * T + 8; N.P.py = c[1] * T + 12; N.P.path = []; }
requestAnimationFrame(loop);
window.__cl = { tick: n => { for (let i = 0; i < n; i++) frame(performance.now(), 1 / 30); return cellOf(me).join(','); }, me, NPCS, LOTS, setHour, npcCard, friendsCard, lotCard, give, INV, go,
  snap: () => cv.toDataURL() };
})().catch(e => { document.body.insertAdjacentHTML('beforeend', `<pre style="position:absolute;top:120px;left:12px;background:#fff;padding:8px;white-space:pre-wrap">${e && e.stack || e}</pre>`); console.error(e); });
</script>
</body>
