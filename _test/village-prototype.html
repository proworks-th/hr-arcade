<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Cozy Village Big</title>
<link rel="icon" href="data:,">
<style>
:root{--ink:#3b2316;--pink:#ff6fa8;--card:#fff8ec;--muted:#7a5c48}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1b1422;font-family:Kanit,"Leelawadee UI",Tahoma,sans-serif;color:var(--ink)}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
.chip{position:absolute;background:var(--card);border:3px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink);padding:5px 12px;font-weight:600;font-size:14px;z-index:3}
#title{left:12px;top:12px}
#clock{left:12px;top:60px;display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 6px 3px 12px}
#clock input{width:120px}
#clock button{min-height:44px;min-width:44px;font:inherit;font-size:12px;font-weight:700;border:2px solid var(--ink);border-radius:10px;background:#fff;color:var(--ink);cursor:pointer}
#clock button.on{background:#ffd54a}
.side{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;z-index:3}
.btn{min-width:44px;min-height:44px;font:inherit;font-weight:700;font-size:15px;background:var(--card);border:3px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink);cursor:pointer;color:var(--ink);padding:0 10px}
#exit{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);display:none;z-index:3;background:#ffd54a}
.tag{position:absolute;transform:translate(-50%,-100%);background:var(--card);border:2px solid var(--ink);border-radius:9px;padding:0 7px;font-size:12px;font-weight:600;white-space:nowrap;pointer-events:none}
.tag.me{background:#ffe066}.tag.npc{background:#e3f1ff}.tag.lot{background:#efe4d0;font-weight:500;font-size:11px;color:var(--muted)}
.tag.place{background:#fff;font-size:13px;font-weight:700;border-width:3px;border-radius:11px}
.bub{position:absolute;transform:translate(-50%,-100%);background:#fff;border:2px solid var(--ink);border-radius:12px;padding:3px 9px;font-size:13px;max-width:230px;pointer-events:none;text-align:center}
.pop{position:absolute;transform:translate(-50%,-100%);font-weight:800;font-size:16px;color:#e8467c;text-shadow:0 2px 0 #fff,0 -1px 0 #fff;pointer-events:none;transition:transform 1.2s ease-out,opacity 1.2s}
#card{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(460px,calc(100% - 32px));max-height:calc(100% - 130px);overflow:auto;background:var(--card);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:12px 14px;display:none;z-index:4}
#card h3{margin:0;font-size:18px}
#card .sub{margin:0;color:var(--muted);font-size:13px}
#card .say{margin:8px 0;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:6px 10px;font-size:14px}
#card .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
#card button{min-height:44px;font:inherit;font-weight:700;border:3px solid var(--ink);border-radius:14px;cursor:pointer;background:#fff;color:var(--ink)}
#card .row>button{flex:1}
#card .pri{background:var(--pink);color:#fff}
#card button:disabled{opacity:.45;cursor:default}
.head{display:flex;gap:10px;align-items:center}
.head canvas{width:48px;image-rendering:pixelated;background:#e3f1ff;border:2px solid var(--ink);border-radius:12px;height:72px;object-fit:cover}
.hearts{font-size:17px;letter-spacing:1px;margin-top:2px}
.lvl{font-size:12px;color:var(--muted)}
.gifts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.gifts button{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:600;padding:3px;min-height:58px;position:relative}
.gifts img{width:27px;height:24px;image-rendering:pixelated}
.gifts .n{position:absolute;right:5px;top:2px;font-size:11px;color:var(--muted)}
.gifts .h{position:absolute;left:4px;top:1px;font-size:11px}
.likes{font-size:13px;margin-top:8px}
.unl{list-style:none;margin:8px 0 0;padding:0;font-size:13px}
.unl li{display:flex;gap:8px;align-items:center;padding:4px 0;border-top:1px dashed #d9c4a8}
.unl li.ok{color:#2f7d3a;font-weight:600}
.unl li.lock{color:var(--muted)}
.fr{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:6px 10px;margin-top:6px;font-weight:600!important}
.fr canvas{width:24px;height:48px;image-rendering:pixelated}
.fr small{display:block;color:var(--muted);font-weight:400}
#toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:6px 14px;font-size:14px;display:none;white-space:nowrap;z-index:5}
#credit{position:absolute;left:12px;bottom:10px;font-size:11px;color:#fffc;text-shadow:0 1px 2px #000a;z-index:2}
#fade{position:absolute;inset:0;background:#1b1422;opacity:0;pointer-events:none;transition:opacity .18s;z-index:2}
#farmhud{left:12px;top:112px;font-size:13px}
#hotwrap{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:none;flex-direction:column;align-items:center;gap:4px;z-index:3}
#selname{background:var(--card);border:2px solid var(--ink);border-radius:9px;padding:0 8px;font-size:12px;font-weight:700;white-space:nowrap}
#tools{display:flex;gap:3px;background:#6b4a33;border:3px solid var(--ink);border-radius:14px;padding:4px;box-shadow:0 3px 0 var(--ink)}
.slot{position:relative;width:44px;height:44px;padding:0;font:inherit;background:#f3e2c2;border:2px solid #3a2a20;border-radius:9px;cursor:pointer;color:var(--ink);display:flex;align-items:center;justify-content:center}
.slot img{width:30px;height:30px;object-fit:contain;image-rendering:pixelated}.slot .em{font-size:23px;line-height:1}
.slot .c{position:absolute;right:2px;bottom:0;font-size:11px;font-weight:800;color:#fff;text-shadow:0 0 2px #000,0 0 2px #000}
.slot .k{position:absolute;left:3px;top:0;font-size:9px;font-weight:700;color:#7a5c48}
#tools .slot.on{background:#ffd54a;outline:3px solid #fff;outline-offset:-5px}
#tools .bagb{font-size:23px;background:#ffe9a8;margin-left:3px}
#card .slot{min-height:0;width:auto;aspect-ratio:1;height:auto;border-width:2px;border-radius:9px;background:#f3e2c2}
#card .slot.pick{background:#ffd54a;outline:3px dashed var(--ink);outline-offset:-6px}
.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:4px;max-width:330px}
.grid6.bag>.slot:nth-child(-n+6){background:#ffe9a8}
#card .lbl{margin-top:8px;font-weight:700;font-size:13px}#card .lbl small{color:var(--muted);font-weight:500}
#card .info{margin-top:6px;background:#fff;border:2px dashed var(--ink);border-radius:10px;padding:6px 9px;font-size:13px;min-height:40px}
#ptip{background:#fffdf6;font-size:12px;z-index:2;display:none}
.gifts button.sel{background:#ffe9a8}
.gifts small{font-size:11px;color:var(--muted);font-weight:500}
.pv{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:8px;background:#fff;border:2px dashed var(--ink);border-radius:12px;padding:8px}
.pv .hs{display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--muted)}.pv .hs img{image-rendering:pixelated}
.gg{display:grid;grid-template-columns:repeat(5,14px);gap:2px;padding:4px;background:#8fd060;border:2px solid var(--ink);border-radius:6px}.gg i{height:14px;border-radius:3px}.gg .old{background:#7a4a2c}.gg .new{background:#c08a57;outline:2px dashed #ffd23f;outline-offset:-2px}
.pv .stg{display:flex;align-items:flex-end;gap:3px}.pv .stg img{image-rendering:pixelated;height:auto}.pv .stg b{color:var(--muted)}
.qty{display:flex;gap:6px;margin-top:6px}.qty button{min-width:52px}.qty .on{background:#ffd54a!important}
.ord{display:flex;gap:10px;align-items:center;margin-top:8px}.ord img{width:40px;height:36px;image-rendering:pixelated}
.bar{height:12px;border:2px solid var(--ink);border-radius:8px;background:#fff;overflow:hidden;margin:4px 0}.bar i{display:block;height:100%;background:#5fbf5a}
.who{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.who span{border:2px solid var(--ink);border-left:8px solid var(--c);border-radius:9px;padding:0 7px;font-size:12px;font-weight:600;background:#fff}
.sell{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.sell button{display:flex;align-items:center;gap:4px;padding:0 8px;font-size:13px}.sell img{width:20px;height:18px;image-rendering:pixelated}
@media (max-width:600px){.side .lbl{display:none}#title small{display:none}#clock input{width:90px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="fade"></div>
<div class="chip" id="title">🏘️ <span id="where">หมู่บ้าน</span> <small style="font-weight:400;color:var(--muted)">· ตัวอย่าง 2</small></div>
<div class="chip" id="clock">🕒 <b id="tm"></b><input id="hour" type="range" min="6" max="23.5" step=".5" aria-label="ดูเวลาอื่น"><button id="real" type="button" class="on">เวลาเกม</button></div>
<button class="btn" id="exit" type="button">🚪 ออกไปข้างนอก</button>
<div class="side">
  <button class="btn" id="friends" type="button" aria-label="เพื่อนบ้าน">💗<span class="lbl"> เพื่อนบ้าน</span></button>
  <button class="btn" id="gohome" type="button" aria-label="กลับบ้าน">🏠<span class="lbl"> บ้านฉัน</span></button>
  <button class="btn" id="gofarm" type="button" aria-label="ไร่ชุมชน">🌾<span class="lbl"> ไร่ชุมชน</span></button>
  <button class="btn" id="zin" type="button" aria-label="ซูมเข้า">＋</button>
  <button class="btn" id="zout" type="button" aria-label="ซูมออก">－</button>
</div>
<div class="chip" id="farmhud"></div>
<div id="hotwrap"><div id="selname"></div><div id="tools"></div></div>
<div id="ptip" class="tag"></div>
<div id="card"></div>
<div id="toast"></div>
<div id="credit">Art: Kenney (CC0) · Tiny Farm RPG by Maeve Devs · ตัวละคร/ผัก: HR Arcade</div>

(id, n) { fresh(); f.bag[id] = (f.bag[id] || 0) + n; save(); }\n  const stat = (k, n) => { if (n > 0 && typeof Stats !== 'undefined') Stats.econ(k, n); };\n  // a sell order fills against the best buy orders at or above its price (a buy, the cheapest sells at or below), oldest first,\n  // always at the resting order's price; a buyer who offered more gets the difference back; whatever is left rests at the stall\n  async function mktPlace(side, id, qn, pr) {\n    if (mBusy) return 0; qn |= 0; const [lo, hi] = mktBand(id); pr = Math.max(lo, Math.min(hi, pr | 0));\n    if (!O || !nm) { toast('\u0e15\u0e25\u0e32\u0e14\u0e15\u0e49\u0e2d\u0e07\u0e15\u0e48\u0e2d\u0e40\u0e19\u0e47\u0e15\u0e41\u0e25\u0e30\u0e15\u0e31\u0e49\u0e07\u0e0a\u0e37\u0e48\u0e2d\u0e01\u0e48\u0e2d\u0e19'); return 0; }\n    if (qn < 1) return 0;\n    if (mineOpen().length >= MKT_MAX) { toast(`\u0e15\u0e31\u0e49\u0e07\u0e44\u0e14\u0e49\u0e04\u0e23\u0e31\u0e49\u0e07\u0e25\u0e30 ${MKT_MAX} \u0e04\u0e33\u0e2a\u0e31\u0e48\u0e07 \u0e22\u0e01\u0e40\u0e25\u0e34\u0e01\u0e2b\u0e23\u0e37\u0e2d\u0e23\u0e2d\u0e43\u0e2b\u0e49\u0e21\u0e35\u0e04\u0e19\u0e08\u0e31\u0e1a\u0e04\u0e39\u0e48\u0e01\u0e48\u0e2d\u0e19`); return 0; }\n    fresh(); p = Prog.get();\n    if (side === 's' ? (f.bag[id] | 0) < qn : p.coins < qn * pr) { toast(side === 's' ? `${CROPS[id][0]}\u0e43\u0e19\u0e15\u0e30\u0e01\u0e23\u0e49\u0e32\u0e44\u0e21\u0e48\u0e1e\u0e2d` : '\u0e40\u0e2b\u0e23\u0e35\u0e22\u0e0d\u0e44\u0e21\u0e48\u0e1e\u0e2d'); return 0; }\n    mBusy = true;\n    if (side === 's') { f.bag[id] -= qn; if (!f.bag[id]) delete f.bag[id]; save(); } else addCoins(-qn * pr);\n    const opp = ordersOf(id).filter(o => o.s !== side && !isMine(o) && (side === 's' ? o.p >= pr : o.p <= pr))\n      .sort((a, b) => (side === 's' ? b.p - a.p : a.p - b.p) || (a.t || 0) - (b.t || 0));\n    let left = qn, got = 0, cP = 0, cN = 0; const who = [];\n    for (const o of opp) { if (!left) break;\n      let u = 0; try { u = o.npc ? await O.npcTake(o.id, left, o.q)     <div class="lbl">🎒 กระเป๋า <small>${BAG.filter(Boolean).length}/${BAG_N} ช่อง · แถวบน = แถบด่วน</small></div><div class="grid6 bag">${BAG.map((_, i) => slotHTML(BAG, i, 'b')).join('')}</div>
    <div class="row"><button data-a="crops">⬇️ เก็บผักทั้งหมดเข้าหีบ</button><button data-a="x" style="flex:0 0 64px">ปิด</button></div>`;
  card.style.display = 'block';
  const move = (from, to, i) => { const x = from[i]; if (!x) return; const left = addTo(to, x.id, x.n); if (left === x.n) return toast(to === CHEST ? '📦 หีบเต็มแล้ว' : '🎒 กระเป๋าเต็มแล้ว'); x.n = left; if (!left) from[i] = null; };
  card.onclick = e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.a === 'x') return closeCard();
    if (b.dataset.a === 'crops') { let n = 0; BAG.forEach((x, i) => { if (x && isCrop(x.id)) { n += x.n; move(BAG, CHEST, i); } }); toast(n ? `📦 เก็บผักเข้าหีบแล้ว` : 'ไม่มีผักในกระเป๋า'); }
    else if (b.dataset.k) b.dataset.k === 'c' ? move(CHEST, BAG, +b.dataset.i) : move(BAG, CHEST, +b.dataset.i);
    save(); hud(); chestCard(); }; }
// ---- seed shop (preview first, buying is a second click) and the village order ----
let shopSel = null, shopQty = 5;
function shopCard() { openN = null; card.dataset.k = 'shop';
  const id = shopSel, price = id ? CROPS[id][2] * shopQty : 0, fits = id ? room(BAG, 's:' + id) >= shopQty : true;
  const stages = id ? ['seed', 'sprout', 'grow'].map(s => `<img src="${bigImg(s, pxa(STAGE_ART[s]), 3)}" alt="">`).join('<b>›</b>') + `<b>›</b><img src="${cropImg(id)}" alt="">` : '';
  const crops = SEED_IDS.filter(k => count(BAG, k) > 0);
  card.innerHTML = `<h3>🛒 ร้านเมล็ด</h3><p class="sub">แตะเมล็ดเพื่อดูก่อน · กด "ซื้อ" อีกครั้งถึงจะจ่าย · มี ${F.coins.toLocaleString()} 🪙</p>
    <div class="gifts">${SEED_IDS.map(s => `<button data-s="${s}" class="${shopSel === s ? 'sel' : ''}"><span class="n">×${count(BAG, 's:' + s)}</span><img src="${seedPackImg(s)}" alt="">${cropName(s)}<small>${CROPS[s][2]} 🪙</small></button>`).join('')}</div>
    ${id ? `<div class="pv"><div class="stg">${stages}</div><div style="flex:1;min-width:150px"><b>เมล็ด${cropName(id)}</b><br><small>โต ${cropTime(id)} · เก็บได้ ${YIELD} ผล · ขาย ${CROPS[id][3]} 🪙/ผล · รดน้ำได้ 3 ครั้ง (ไวขึ้นสูงสุด 45%)</small>
      <div class="qty">${[1, 5, 10].map(q => `<button data-q="${q}" class="${shopQty === q ? 'on' : ''}">×${q}</button>`).join('')}</div></div></div>
      <div class="row"><button class="pri" data-a="buy" ${F.coins >= price && fits ? '' : 'disabled'}>${fits ? `ซื้อ ${shopQty} เมล็ด · ${price} 🪙` : '🎒 กระเป๋าเต็ม'}</button><button data-a="cancel">ยกเลิก</button></div>` : ''}
    ${crops.length ? `<p class="sub" style="margin-top:8px">ขายผักในกระเป๋า (แตะ = ขาย 1)</p><div class="sell">${crops.map(k => `<button data-sell="${k}"><img src="${cropImg(k)}" alt="">×${count(BAG, k)} <small>+${CROPS[k][3]}</small></button>`).join('')}</div>` : ''}
    <div class="row"><button data-a="x">ปิด</button></div>`;
  card.style.display = 'block';
  card.onclick = e => { const b = e.target.closest('button'); if (!b || b.disabled) return;
    if (b.dataset.a === 'x') { shopSel = null; return closeCard(); }
    if (b.dataset.a === 'cancel') { shopSel = null; return shopCard(); }
    if (b.dataset.s) { shopSel = b.dataset.s; return shopCard(); }
    if (b.dataset.q) { shopQty = +b.dataset.q; return shopCard(); }
    if (b.dataset.a === 'buy' && F.coins >= price && fits) { F.coins -= price; addTo(BAG, 's:' + id, shopQty); holdFor('seed'); const i = BAG.findIndex((x, j) => j < HOT && x && x.id === 's:' + id); if (i >= 0) F.sel = i;
      toast(`✅ ซื้อเมล็ด${cropName(id)} ${shopQty} · −${price} 🪙`); shopSel = null; save(); hud(); return shopCard(); }
    if (b.dataset.sell) { const k = b.dataset.sell; if (count(BAG, k)) { takeFrom(BAG, k, 1); F.coins += CROPS[k][3]; save(); hud(); shopCard(); } } }; }
function orderCard() { openN = null; card.dataset.k = 'order';
  const [id, need, title] = orderNow(), o = F.order, have = count(BAG, id), n = Math.min(have, need - o.n);
  card.innerHTML = `<h3>📋 ออร์เดอร์หมู่บ้าน</h3><p class="sub">ช่วยกันส่งผัก ครบแล้วทุกคนที่ช่วยได้รางวัล · สำเร็จแล้ว ${F.done} ออร์เดอร์</p>
    <div class="ord"><img src="${cropImg(id)}" alt=""><div style="flex:1"><b>${title}</b><div class="bar"><i style="width:${o.n / need * 100}%"></i></div><small>${cropName(id)} ${o.n}/${need}</small></div></div>
    <div class="who">${Object.entries(o.by).map(([k, c]) => `<span style="--c:${FARMER[k].col}">${nameOf(k)} ×${c}</span>`).join('') || '<small class="sub">ยังไม่มีใครส่ง เป็นคนแรกเลย</small>'}</div>
    <div class="row"><button class="pri" data-a="give" ${n ? '' : 'disabled'}>ส่ง${cropName(id)} ×${n} (ในกระเป๋า ${have})</button><button data-a="x" style="flex:0 0 64px">ปิด</button></div>
    <p class="sub" style="margin-top:6px">รางวัลตอนครบ: 50 🪙 + 8 🪙 ต่อผักที่คุณส่ง · +3 น้ำใจ${count(CHEST, id) ? ` · ในหีบมีอีก ${count(CHEST, id)}` : ''}</p>`;
  card.style.display = 'block';
  card.onclick = e => { const b = e.target.closest('button'); if (!b || b.disabled) return; if (b.dataset.a === 'x') return closeCard();
    if (b.dataset.a === 'give' && n) { takeFrom(BAG, id, n); F.kind++; toast(`📋 ส่ง${cropName(id)} ${n} · +1 น้ำใจ`); contribute('me', n); save(); hud(); orderCard(); } }; }

/* ---- my house: starter → big (preview first, pay on a second click, then it builds on the real clock) ---- */
const BIG_PRICE = 1500, BIG_MIN = 30, ROOM_SZ = big => big ? '11×7' : '8×6';
const houseImg = big => bigImg('house' + big, houseFor({ stage: big ? 3 : 2, rc: MY.rc, wc: MY.wc }), 1);
const homeReady = () => HOME.big && Date.now() >= HOME.until;
const reloadHome = () => { document.getElementById('fade').style.opacity = 1; setTimeout(() => location.replace(location.pathname + location.search.replace(/[?&]fresh=1/, '').replace(/^&/, '?')), 250); };
function homeCard() { openN = null; card.dataset.k = 'home';
  const big = HOME.big && !MY.building, st = !HOME.big ? 'บ้านหลังแรก (บ้านเริ่มต้น)' : MY.building ? 'กำลังขยายเป็นบ้านหลังใหญ่' : 'บ้านหลังใหญ่';
  const prog = MY.building ? (homeReady() ? `<p class="sub" style="margin-top:6px">🔨 ช่างสร้างเสร็จแล้ว!</p>` :
    `<div class="bar"><i style="width:${Math.min(100, (1 - (HOME.until - Date.now()) / HOME.dur) * 100)}%"></i></div><small>เสร็จในอีก ${mmss(HOME.until - Date.now())} · ระหว่างนี้ยังอยู่บ้านหลังเดิมได้</small>`) : '';
  card.innerHTML = `<h3>🏠 บ้านของฉัน</h3><p class="sub">${st} · ห้อง ${ROOM_SZ(big)} · สวน ${gCells(MY).length} แปลง</p>${prog}
    <div class="row"><button class="pri" data-a="in">🚪 เข้าบ้าน</button>
    ${!HOME.big ? '<button data-a="up">⬆️ ขยายบ้าน</button>' : MY.building && homeReady() ? '<button class="pri" data-a="move">✨ ย้ายเข้าบ้านหลังใหญ่</button>' : !MY.building && !HOME.garden ? '<button data-a="garden">🌱 ขยายสวน</button>' : ''}<button data-a="x" style="flex:0 0 64px">ปิด</button></div>`;
  card.style.display = 'block';
  card.onclick = e => { const b = e.target.closest('button'); if (!b) return; const a = b.dataset.a;
    if (a === 'x') return closeCard(); if (a === 'in') return enter(MY.room); if (a === 'up') return upCard(); if (a === 'garden') return gardenCard(); if (a === 'move') { toast('🎉 ขึ้นบ้านใหม่!'); return reloadHome(); } }; }
function upCard() { card.dataset.k = 'home';
  const ok = F.coins >= BIG_PRICE;
  card.innerHTML = `<h3>⬆️ ขยายเป็นบ้านหลังใหญ่</h3><p class="sub">ดูก่อน · กด "สร้าง" อีกครั้งถึงจะจ่าย · มี ${F.coins.toLocaleString()} 🪙</p>
    <div class="pv" style="justify-content:center"><div class="hs"><img src="${houseImg(0)}" alt=""><small>ตอนนี้</small></div><b style="font-size:22px">›</b><div class="hs"><img src="${houseImg(1)}" alt=""><small>หลังขยาย</small></div></div>
    <ul class="unl"><li>🛏️ ห้องใหญ่ขึ้น ${ROOM_SZ(0)} → <b>${ROOM_SZ(1)}</b></li><li>🛋️ ได้โซฟา + เคาน์เตอร์ครัว + มุมรูปภาพเพิ่ม</li><li>🌼 ปลูกดอกไม้หน้าบ้าน + รั้วสวน</li><li>⏳ ช่างสร้าง ${BIG_MIN} นาที (เวลาจริง) · ระหว่างสร้างยังอยู่บ้านเดิมได้</li></ul>
    <div class="row"><button class="pri" data-a="buy" ${ok ? '' : 'disabled'}>${ok ? `สร้าง · ${BIG_PRICE.toLocaleString()} 🪙` : `ขาดอีก ${(BIG_PRICE - F.coins).toLocaleString()} 🪙`}</button><button data-a="back">ยกเลิก</button></div>
    ${ok ? '' : '<p class="sub" style="margin-top:6px">หาเหรียญได้จากขายผักที่ 🛒 ร้านเมล็ด และส่ง 📋 ออร์เดอร์หมู่บ้าน</p>'}`;
  card.style.display = 'block';
  card.onclick = e => { const b = e.target.closest('button'); if (!b || b.disabled) return;
    if (b.dataset.a === 'back') return homeCard();
    if (b.dataset.a === 'buy' && F.coins >= BIG_PRICE) { F.coins -= BIG_PRICE; save(); const dur = BIG_MIN * 60e3 / SPEED;
      try { localStorage.setItem(HOME_KEY, JSON.stringify({ big: 1, until: Date.now() + dur, dur })); } catch (e) { /* private window */ }
      toast(`🔨 ช่างเริ่มสร้างแล้ว · −${BIG_PRICE.toLocaleString()} 🪙`); setTimeout(reloadHome, 900); } }; }
let homeToldDone = false;
// ---- big house → garden 10 → 14 plots (preview first, pay on a second click) ----
const GARDEN_PRICE = 750;   // prototype scale: half the big house, like the plan's 10,000 vs 20,000
const gardenGrid = n => `<div class="gg">${Array.from({ length: 15 }, (_, i) => `<i class="${i < 10 ? 'old' : i < n ? 'new' : ''}"></i>`).join('')}</div>`;
function gardenCard() { card.dataset.k = 'home';
  const ok = F.coins >= GARDEN_PRICE;
  card.innerHTML = `<h3>🌱 ขยายสวนหน้าบ้าน</h3><p class="sub">ดูก่อน · กด "ขยาย" อีกครั้งถึงจะจ่าย · มี ${F.coins.toLocaleString()} 🪙</p>
    <div class="pv" style="justify-content:center"><div class="hs">${gardenGrid(10)}<small>ตอนนี้ 10 แปลง</small></div><b style="font-size:22px">›</b><div class="hs">${gardenGrid(14)}<small>หลังขยาย 14 แปลง</small></div></div>
    <ul class="unl"><li>🌾 ได้แปลงเพิ่ม 4 แปลง (แถวที่ 3) · พรวนดินไว้ให้แล้ว ปลูกได้ทันที</li><li>🚶 เดินแทรกระหว่างแปลงได้ ทุกแปลงเอื้อมถึง</li><li>🔒 สวนหน้าบ้านเป็นของคุณคนเดียว (ไร่ชุมชนเป็นของทุกคน)</li></ul>
    <div class="row"><button class="pri" data-a="buy" ${ok ? '' : 'disabled'}>${ok ? `ขยาย · ${GARDEN_PRICE.toLocaleString()} 🪙` : `ขาดอีก ${(GARDEN_PRICE - F.coins).toLocaleString()} 🪙`}</button><button data-a="back">ยกเลิก</button></div>`;
  card.style.display = 'block';
  card.onclick = e => { const b = e.target.closest('button'); if (!b || b.disabled) return;
    if (b.dataset.a === 'back') return homeCard();
    if (b.dataset.a === 'buy' && F.coins >= GARDEN_PRICE) { F.coins -= GARDEN_PRICE; save();
      try { localStorage.setItem(HOME_KEY, JSON.stringify({ ...HOME, garden: 1 })); } catch (e) { /* private window */ }
      toast(`🌱 ขยายสวนเป็น 14 แปลงแล้ว · −${GARDEN_PRICE} 🪙`); setTimeout(reloadHome, 900); } }; }

/* ============ input ============ */
function pick(wx, wy) {
  for (const N of NPCS) if (sceneOf(cellOf(N.P)) === scene && Math.abs(N.P.px - wx) < 10 && wy > N.P.py - 30 && wy < N.P.py + 4) return { npc: N };
  if (scene) return null;
  for (const B of BUILDINGS) if (wx >= B.x * T && wx < (B.x + B.w) * T && wy >= B.y * T - 8 && wy < (B.y + B.h) * T) return { enter: B.room };
  const pcx = Math.floor(wx / T), pcy = Math.floor(wy / T), pl = PLOTS.find(q => q.x === pcx && q.y === pcy); if (pl) return { plot: pl };
  if (wx >= 36 * T && wx < 39.5 * T && wy >= 35.3 * T && wy < 39 * T) return { shop: 1 };
  if (wx >= 40 * T && wx < 43 * T && wy >= 36.4 * T && wy < 39 * T) return { orders: 1 };
  if (wx >= 35 * T && wx < 36 * T && wy >= 39.2 * T && wy < 41 * T) return { chest: 1 };
  for (const L of LOTS) { const cx = (L.x + 2) * T + 8, by = (L.y + 3) * T + 2;
    if (L.room && Math.abs(cx - wx) < 34 && wy < by && wy > by - 88) return { enter: L.room, lot: L };
    if (wx >= L.x * T && wx < (L.x + 10) * T && wy >= L.y * T && wy < (L.y + 3) * T) return { lot: L }; }
  return null; }
const worldAt = e => [e.clientX / SC + view.ox, e.clientY / SC + view.oy];
cv.addEventListener('pointerdown', e => {
  const [wx, wy] = worldAt(e), hit = pick(wx, wy);
  if (hit?.npc) return talkTo(hit.npc);
  if (hit?.enter) { toast('🚪 ' + hit.enter.title); return enter(hit.enter); }
  if (hit?.plot) return useItem(hit.plot);
  if (hit?.shop) return visit(SPOTS.shop, shopCard);
  if (hit?.orders) return visit(SPOTS.order, orderCard);
  if (hit?.chest) return visit(SPOTS.chest, chestCard);
  if (hit?.lot) return visit([hit.lot.x + 2, hit.lot.y + 3], () => lotCard(hit.lot), 3);
  closeCard(); me.after = null; go(me, [Math.floor(wx / T), Math.floor(wy / T)]);
});
cv.addEventListener('pointermove', e => { const [wx, wy] = worldAt(e), h = pick(wx, wy); hoverP = e.pointerType === 'mouse' ? h?.plot || null : null; cv.style.cursor = CUR[h?.npc ? 'talk' : h?.enter ? 'door' : h?.lot || h?.plot || h?.shop || h?.orders || h?.chest ? 'hand' : 'arrow']; });
cv.addEventListener('pointerleave', () => { hoverP = null; });
cv.style.cursor = CUR.arrow;
exitB.onclick = () => { if (scene) { place(me, scene.out); me.dir = 'down'; } };
const KEYS = { arrowup: [0, -1], w: [0, -1], arrowdown: [0, 1], s: [0, 1], arrowleft: [-1, 0], a: [-1, 0], arrowright: [1, 0], d: [1, 0] };
addEventListener('keydown', e => { const k = KEYS[e.key.toLowerCase()]; if (k) { held.add(k); e.preventDefault(); return; }
  if (scene) return; const n = '123456'.indexOf(e.key); if (n >= 0 && e.key) { F.sel = n; hud(); return; }
  const q = e.key.toLowerCase(); if (q === 'i' || q === 'b') return card.dataset.k === 'bag' && card.style.display === 'block' ? closeCard() : bagCard();
  if (q === 'escape') return closeCard();
  if ((e.key === ' ' || q === 'e') && !scene) { const p = frontPlot(); if (p) { e.preventDefault(); useItem(p); } } });
addEventListener('keyup', e => { const k = KEYS[e.key.toLowerCase()]; if (k) held.delete(k); });
document.getElementById('friends').onclick = friendsCard;
document.getElementById('gohome').onclick = () => { if (scene === MY.room) return toast('🏠 อยู่บ้านแล้ว'); visit([MY.x + 2, MY.y + 3], () => lotCard(MY), 3); };
document.getElementById('gofarm').onclick = () => { closeCard(); travel(me, [28, 36]); };

/* ============ start ============ */
load(); hud(); if (/[?&]farm=1\b/.test(location.search)) { place(me, [28, 38]); cam.x = me.px; cam.y = me.py; }
setHour(real ? thaiNow() : hour);
for (const N of NPCS) { const c = near(...spotCell(N.at[1])); place(N.P, c); N.P.after = null; }
requestAnimationFrame(loop);
window.__cb = { DAY_MS, gameDay, thaiNow, tick: n => { for (let i = 0; i < n; i++) frame(performance.now(), 1 / 30); return cellOf(me).join(',') + ' ' + (scene ? scene.title : 'village'); },
  HOME, MY, homeCard, upCard, gardenCard, homeSim,
  PLOTS, F, FARMER, BAG, CHEST, count, act, useItem, botThink, orderNow, orderCard, shopCard, bagCard, chestCard, visit, talkTo, save, hud, get card() { return card; },
  me, NPCS, LOTS, ROOMS, ROOM, BUILDINGS, setHour, npcCard, friendsCard, lotCard, give, go, travel, enter, cellOf, sceneOf, get scene() { return scene; } };
})().catch(e => { document.body.insertAdjacentHTML('beforeend', `<pre style="position:absolute;top:120px;left:12px;background:#fff;padding:8px;white-space:pre-wrap;z-index:9">${e && e.stack || e}</pre>`); console.error(e); });
</script>
